name: Build APK

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Google Drive APK file ID"
        required: true
        default: "14UV16nRMrBgQmKVxNbKrEov7bQXnkjMn"

      english:
        description: "Overlay English files"
        required: true
        default: "false"

      app_name:
        description: "App name"
        required: true
        default: "Berlions"

      controls:
        description: "Enable touch controls"
        required: true
        default: "true"

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"
  GRADLE_VERSION: "9.4.1"
  SDL_VERSION: "2.32.10"

jobs:
  apk:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # JAVA
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ==========================================
      # ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"


      # ==========================================
      # SDK / NDK / CMAKE
      # ==========================================
      - name: Install Android SDK packages
        run: |
          set -e

          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          yes | sdkmanager --licenses || true


      # ==========================================
      # GRADLE
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # ==========================================
      # GAME DATA
      # ==========================================
      - name: Download game data
        env:
          FILE_ID: ${{ inputs.drive_file_id }}
          ENGLISH: ${{ inputs.english }}
        run: |
          set -e

          python3 -m pip install --upgrade gdown

          gdown \
            "https://drive.google.com/uc?id=${FILE_ID}" \
            -O source.apk

          mkdir -p assets/redalert tmp

          unzip -q source.apk \
            'assets/mobsik/*.zip' \
            -d tmp

          unzip -q -o \
            tmp/assets/mobsik/red-alert-data.zip \
            -d assets/redalert

          if [ "$ENGLISH" = "true" ]; then
            unzip -q -o \
              tmp/assets/mobsik/red-alert-data-en.zip \
              -d assets/redalert
          fi

          test -f \
            assets/redalert/allies/INSTALL/REDALERT.INI

          rm -rf source.apk tmp

          echo "Game data:"
          du -sh assets/redalert


      # ==========================================
      # SDL2
      # ==========================================
      - name: Download SDL2
        run: |
          set -e

          mkdir -p android/third_party

          curl -fL \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz" \
            -o /tmp/SDL2.tar.gz

          tar -xzf /tmp/SDL2.tar.gz \
            -C android/third_party

          mv \
            "android/third_party/SDL2-${SDL_VERSION}" \
            android/third_party/SDL


      # ==========================================
      # PROJECT CHECK
      # ==========================================
      - name: Check project
        run: |
          set -e

          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/CMakeLists.txt

          echo "Project structure OK"


      # ==========================================
      # APP NAME
      # ==========================================
      - name: Set application name
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -e

          sed -i \
            "s|android:label=\"Red Alert\"|android:label=\"${APP_NAME}\"|" \
            android/app/src/main/AndroidManifest.xml

          grep 'android:label=' \
            android/app/src/main/AndroidManifest.xml


      # ==========================================
      # CHECK KEYSTORE
      # ==========================================
      - name: Check signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -u

          echo "======================================"
          echo "CHECKING SIGNING KEY"
          echo "======================================"

          echo ""
          echo "1. Checking secrets..."

          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: KEYSTORE_B64 is empty"
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is empty"
            exit 1
          fi

          echo "KEYSTORE_B64: present"
          echo "KEYSTORE_PASSWORD: present"


          echo ""
          echo "2. Java environment..."

          java -version

          echo ""
          echo "keytool location:"
          command -v keytool


          echo ""
          echo "3. Base64 length..."

          B64_LENGTH=$(printf '%s' "$KEYSTORE_B64" | wc -c)

          echo "Base64 length: ${B64_LENGTH} characters"

          if [ "$B64_LENGTH" -lt 100 ]; then
            echo "ERROR: KEYSTORE_B64 is suspiciously short"
            exit 1
          fi


          echo ""
          echo "4. Decoding PKCS12..."

          KS="$RUNNER_TEMP/release.p12"

          if ! printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"; then
            echo "ERROR: Base64 decoding failed"
            exit 1
          fi


          echo ""
          echo "5. Checking decoded file..."

          if [ ! -s "$KS" ]; then
            echo "ERROR: decoded keystore is empty"
            exit 1
          fi

          ls -lh "$KS"

          file "$KS"

          KS_SIZE=$(stat -c%s "$KS")

          echo "Keystore size: ${KS_SIZE} bytes"


          echo ""
          echo "6. SHA-256 of decoded keystore..."

          SHA256=$(sha256sum "$KS" | awk '{print $1}')

          echo "Keystore SHA-256:"
          echo "$SHA256"


          echo ""
          echo "7. Testing PKCS12..."

          set +e

          keytool -list \
            -v \
            -keystore "$KS" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            > "$RUNNER_TEMP/keytool.out" \
            2> "$RUNNER_TEMP/keytool.err"

          RESULT=$?

          set -e

          echo ""
          echo "keytool exit code: $RESULT"


          echo ""
          echo "----- keytool stdout -----"

          cat "$RUNNER_TEMP/keytool.out" || true


          echo ""
          echo "----- keytool stderr -----"

          cat "$RUNNER_TEMP/keytool.err" || true


          if [ "$RESULT" -ne 0 ]; then

            echo ""
            echo "======================================"
            echo "KEYSTORE CHECK FAILED"
            echo "======================================"

            echo ""
            echo "Decoded file SHA-256:"
            echo "$SHA256"

            echo ""
            echo "Possible causes:"
            echo "1. KEYSTORE_PASSWORD does not match this PKCS12."
            echo "2. KEYSTORE_B64 belongs to another .p12."
            echo "3. KEYSTORE_B64 is incomplete."
            echo "4. The .p12 file is corrupted."
            echo "5. The file is not a valid PKCS12 keystore."

            exit "$RESULT"
          fi


          echo ""
          echo "8. Searching for PrivateKeyEntry..."

          ALIAS=$(awk -F, \
            '/PrivateKeyEntry/ {print $1; exit}' \
            "$RUNNER_TEMP/keytool.out")


          if [ -z "$ALIAS" ]; then
            echo "ERROR: No PrivateKeyEntry found"
            exit 1
          fi

          echo "Alias found: $ALIAS"


          echo ""
          echo "======================================"
          echo "KEYSTORE IS VALID"
          echo "PASSWORD IS CORRECT"
          echo "PRIVATE KEY FOUND"
          echo "======================================"


      # ==========================================
      # PREPARE SIGNING KEY
      # ==========================================
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          KS="$RUNNER_TEMP/release.p12"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"

          ALIAS=$(keytool -list \
            -keystore "$KS" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            | awk -F, '/PrivateKeyEntry/ {print $1; exit}')

          test -n "$ALIAS"

          FP=$(keytool -list -v \
            -keystore "$KS" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$ALIAS" \
            | awk '/SHA256:/ {print $2; exit}' \
            | tr -d ':' \
            | tr 'A-F' 'a-f')

          test "${#FP}" -eq 64

          echo "KS_PATH=$KS" >> "$GITHUB_ENV"
          echo "KS_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "KS_FP=$FP" >> "$GITHUB_ENV"

          printf \
            '#define RA_EXPECTED_CERT_SHA256 "%s"\n' \
            "$FP" \
            > PORT/ANDROID/src/ra_sig_hash.h

          echo "Certificate SHA-256: $FP"


      # ==========================================
      # TOUCH CONTROLS
      # ==========================================
      - name: Add touch controls
        if: ${{ inputs.controls == 'true' }}
        run: |
          set -e

          mkdir -p android/app/src/main/java/com/ra/port

          cat > android/app/src/main/java/com/ra/port/TouchControls.java <<'EOF'
          package com.ra.port;

          import android.app.Activity;
          import android.widget.FrameLayout;
          import android.widget.Button;

          public class TouchControls {

              public static void attach(Activity activity) {

                  FrameLayout root =
                      activity.findViewById(android.R.id.content);

                  Button left = new Button(activity);
                  left.setText("←");

                  Button right = new Button(activity);
                  right.setText("→");

                  Button up = new Button(activity);
                  up.setText("↑");

                  Button down = new Button(activity);
                  down.setText("↓");

                  Button action = new Button(activity);
                  action.setText("A");

                  FrameLayout.LayoutParams leftLp =
                      new FrameLayout.LayoutParams(180, 180);
                  leftLp.leftMargin = 30;
                  leftLp.topMargin = 100;

                  FrameLayout.LayoutParams rightLp =
                      new FrameLayout.LayoutParams(180, 180);
                  rightLp.leftMargin = 220;
                  rightLp.topMargin = 100;

                  FrameLayout.LayoutParams upLp =
                      new FrameLayout.LayoutParams(180, 180);
                  upLp.leftMargin = 125;
                  upLp.topMargin = 0;

                  FrameLayout.LayoutParams downLp =
                      new FrameLayout.LayoutParams(180, 180);
                  downLp.leftMargin = 125;
                  downLp.topMargin = 200;

                  FrameLayout.LayoutParams actionLp =
                      new FrameLayout.LayoutParams(200, 200);
                  actionLp.leftMargin = 850;
                  actionLp.topMargin = 200;

                  root.addView(left, leftLp);
                  root.addView(right, rightLp);
                  root.addView(up, upLp);
                  root.addView(down, downLp);
                  root.addView(action, actionLp);
              }
          }
          EOF


      # ==========================================
      # BUILD
      # ==========================================
      - name: Build APK
        run: |
          set -e

          gradle \
            -p android \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace


      # ==========================================
      # SIGN APK
      # ==========================================
      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -f "$KS_PATH"

          echo "Signing APK..."

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$KS_PATH" \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --out "$RUNNER_TEMP/berlions-signed.apk" \
            "$APK"

          echo "APK signed successfully."


      # ==========================================
      # VERIFY APK
      # ==========================================
      - name: Verify APK
        run: |
          set -e

          APK="$RUNNER_TEMP/berlions-signed.apk"

          test -f "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK certificate:"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --print-certs \
            "$APK"


      # ==========================================
      # UPLOAD
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: redalert-apk
          path: ${{ runner.temp }}/berlions-signed.apk
          retention-days: 7