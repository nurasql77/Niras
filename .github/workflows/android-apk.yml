name: Build APK

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Google Drive APK file ID"
        required: true
        default: "14UV16nRMrBgQmKVxNbKrEov7bQXnkjMn"
      english:
        description: "Overlay English files"
        required: true
        default: "false"
      app_name:
        description: "App name"
        required: true
        default: "Berlions"
      controls:
        description: "Add on-screen buttons (true/false)"
        required: true
        default: "true"
      stretch:
        description: "Stretch the picture to the full screen (true/false)"
        required: true
        default: "true"
      direct_touch:
        description: "Direct touch: no mouse pointer on screen (true/false)"
        required: true
        default: "true"
      touch_fix:
        description: "Fix tap position: use the real drawing surface size (true/false)"
        required: true
        default: "true"
      touch_debug:
        description: "Diagnostic: draw red/blue crosses at each tap (true/false)"
        required: true
        default: "false"

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"
  GRADLE_VERSION: "9.4.1"
  SDL_VERSION: "2.32.10"

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          set -e
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          yes | sdkmanager --licenses || true
          echo "Installed packages:"
          sdkmanager --list_installed | head -50

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Check build tools
        run: |
          set -e
          echo "Java:"
          java -version
          echo
          echo "Gradle:"
          gradle --version
          echo
          echo "Android SDK: $ANDROID_HOME"
          echo
          echo "NDK check:"
          ls -la "$ANDROID_HOME/ndk/28.2.13676358" | head -5
          echo
          echo "CMake check:"
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --version

      - name: Download game data
        env:
          FILE_ID: ${{ inputs.drive_file_id }}
          ENGLISH: ${{ inputs.english }}
        run: |
          set -e
          python3 -m pip install --upgrade gdown
          echo "Downloading source APK..."
          gdown "https://drive.google.com/uc?id=${FILE_ID}" -O source.apk
          test -s source.apk
          ls -lh source.apk
          mkdir -p assets/redalert tmp
          echo "Extracting Red Alert data..."
          unzip -q source.apk 'assets/mobsik/*.zip' -d tmp
          test -f tmp/assets/mobsik/red-alert-data.zip
          unzip -q -o tmp/assets/mobsik/red-alert-data.zip -d assets/redalert
          if [ "$ENGLISH" = "true" ]; then
            echo "Applying English data..."
            test -f tmp/assets/mobsik/red-alert-data-en.zip
            unzip -q -o tmp/assets/mobsik/red-alert-data-en.zip -d assets/redalert
          fi
          test -f assets/redalert/allies/INSTALL/REDALERT.INI
          echo "REDALERT.INI found."
          du -sh assets/redalert
          rm -rf source.apk tmp

      - name: Download SDL2
        run: |
          set -e
          mkdir -p android/third_party
          echo "Downloading SDL 2.32.10..."
          curl -fL "https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz" -o /tmp/SDL2.tar.gz
          test -s /tmp/SDL2.tar.gz
          tar -xzf /tmp/SDL2.tar.gz -C android/third_party
          rm -rf android/third_party/SDL
          mv android/third_party/SDL2-2.32.10 android/third_party/SDL
          ls -la android/third_party/SDL | head -10

      - name: Check Android project
        run: |
          set -e
          test -f assets/redalert/allies/INSTALL/REDALERT.INI
          test -f android/app/CMakeLists.txt
          test -f android/app/build.gradle.kts
          echo "Project checks passed."

      - name: Set application name
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -e
          sed -i "s|android:label=\"Red Alert\"|android:label=\"${APP_NAME}\"|" android/app/src/main/AndroidManifest.xml
          grep 'android:label' android/app/src/main/AndroidManifest.xml

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Add repository secrets KEYSTORE_B64 and KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          KS="$RUNNER_TEMP/release.p12"
          echo "$KEYSTORE_B64" | base64 -d > "$KS"
          ALIAS=$(keytool -list -keystore "$KS" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" | awk -F, '/PrivateKeyEntry/ {print $1; exit}')
          test -n "$ALIAS"
          FP=$(keytool -list -v -keystore "$KS" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias "$ALIAS" | awk '/SHA256:/ {print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          test "${#FP}" -eq 64
          echo "KS_PATH=$KS" >> "$GITHUB_ENV"
          echo "KS_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "KS_FP=$FP" >> "$GITHUB_ENV"
          printf '#define RA_EXPECTED_CERT_SHA256 "%s"\n' "$FP" > PORT/ANDROID/src/ra_sig_hash.h
          echo "Certificate SHA-256: $FP"

      - name: Add signature check
        run: |
          set -e
          cat > PORT/ANDROID/src/ra_apk_sig.h <<'APKEOF'
          #ifndef RA_APK_SIG_H
          #define RA_APK_SIG_H

          /* Reads the signing certificate straight from the APK file (v2/v3 signing block),
           * independent of PackageManager. Pure C++98, no Android dependencies. */

          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          /* ---------------- SHA-256 ---------------- */

          struct RaSha256 {
              unsigned long state[8];
              unsigned long long length;
              unsigned char buffer[64];
              unsigned int used;
          };

          static inline unsigned long ra_rotr(unsigned long x, unsigned int n)
          {
              return ((x >> n) | (x << (32 - n))) & 0xFFFFFFFFUL;
          }

          static void ra_sha256_block(RaSha256 *c, unsigned char const *p)
          {
              static unsigned long const K[64] = {
                  0x428a2f98UL,0x71374491UL,0xb5c0fbcfUL,0xe9b5dba5UL,0x3956c25bUL,0x59f111f1UL,0x923f82a4UL,0xab1c5ed5UL,
                  0xd807aa98UL,0x12835b01UL,0x243185beUL,0x550c7dc3UL,0x72be5d74UL,0x80deb1feUL,0x9bdc06a7UL,0xc19bf174UL,
                  0xe49b69c1UL,0xefbe4786UL,0x0fc19dc6UL,0x240ca1ccUL,0x2de92c6fUL,0x4a7484aaUL,0x5cb0a9dcUL,0x76f988daUL,
                  0x983e5152UL,0xa831c66dUL,0xb00327c8UL,0xbf597fc7UL,0xc6e00bf3UL,0xd5a79147UL,0x06ca6351UL,0x14292967UL,
                  0x27b70a85UL,0x2e1b2138UL,0x4d2c6dfcUL,0x53380d13UL,0x650a7354UL,0x766a0abbUL,0x81c2c92eUL,0x92722c85UL,
                  0xa2bfe8a1UL,0xa81a664bUL,0xc24b8b70UL,0xc76c51a3UL,0xd192e819UL,0xd6990624UL,0xf40e3585UL,0x106aa070UL,
                  0x19a4c116UL,0x1e376c08UL,0x2748774cUL,0x34b0bcb5UL,0x391c0cb3UL,0x4ed8aa4aUL,0x5b9cca4fUL,0x682e6ff3UL,
                  0x748f82eeUL,0x78a5636fUL,0x84c87814UL,0x8cc70208UL,0x90befffaUL,0xa4506cebUL,0xbef9a3f7UL,0xc67178f2UL };
              unsigned long w[64];
              for (int i = 0; i < 16; ++i) {
                  w[i] = ((unsigned long)p[i*4] << 24) | ((unsigned long)p[i*4+1] << 16) |
                         ((unsigned long)p[i*4+2] << 8) | (unsigned long)p[i*4+3];
              }
              for (int i = 16; i < 64; ++i) {
                  unsigned long s0 = ra_rotr(w[i-15], 7) ^ ra_rotr(w[i-15], 18) ^ (w[i-15] >> 3);
                  unsigned long s1 = ra_rotr(w[i-2], 17) ^ ra_rotr(w[i-2], 19) ^ (w[i-2] >> 10);
                  w[i] = (w[i-16] + s0 + w[i-7] + s1) & 0xFFFFFFFFUL;
              }
              unsigned long a = c->state[0], b = c->state[1], cc = c->state[2], d = c->state[3];
              unsigned long e = c->state[4], f = c->state[5], g = c->state[6], h = c->state[7];
              for (int i = 0; i < 64; ++i) {
                  unsigned long S1 = ra_rotr(e, 6) ^ ra_rotr(e, 11) ^ ra_rotr(e, 25);
                  unsigned long ch = (e & f) ^ ((~e) & g);
                  unsigned long t1 = (h + S1 + ch + K[i] + w[i]) & 0xFFFFFFFFUL;
                  unsigned long S0 = ra_rotr(a, 2) ^ ra_rotr(a, 13) ^ ra_rotr(a, 22);
                  unsigned long maj = (a & b) ^ (a & cc) ^ (b & cc);
                  unsigned long t2 = (S0 + maj) & 0xFFFFFFFFUL;
                  h = g; g = f; f = e; e = (d + t1) & 0xFFFFFFFFUL;
                  d = cc; cc = b; b = a; a = (t1 + t2) & 0xFFFFFFFFUL;
              }
              c->state[0] = (c->state[0] + a) & 0xFFFFFFFFUL; c->state[1] = (c->state[1] + b) & 0xFFFFFFFFUL;
              c->state[2] = (c->state[2] + cc) & 0xFFFFFFFFUL; c->state[3] = (c->state[3] + d) & 0xFFFFFFFFUL;
              c->state[4] = (c->state[4] + e) & 0xFFFFFFFFUL; c->state[5] = (c->state[5] + f) & 0xFFFFFFFFUL;
              c->state[6] = (c->state[6] + g) & 0xFFFFFFFFUL; c->state[7] = (c->state[7] + h) & 0xFFFFFFFFUL;
          }

          static void ra_sha256_init(RaSha256 *c)
          {
              c->state[0] = 0x6a09e667UL; c->state[1] = 0xbb67ae85UL; c->state[2] = 0x3c6ef372UL; c->state[3] = 0xa54ff53aUL;
              c->state[4] = 0x510e527fUL; c->state[5] = 0x9b05688cUL; c->state[6] = 0x1f83d9abUL; c->state[7] = 0x5be0cd19UL;
              c->length = 0;
              c->used = 0;
          }

          static void ra_sha256_update(RaSha256 *c, unsigned char const *data, size_t len)
          {
              for (size_t i = 0; i < len; ++i) {
                  c->buffer[c->used++] = data[i];
                  if (c->used == 64) {
                      ra_sha256_block(c, c->buffer);
                      c->used = 0;
                  }
              }
              c->length += (unsigned long long)len;
          }

          static void ra_sha256_final(RaSha256 *c, char hex_out[65])
          {
              static char const *hex = "0123456789abcdef";
              unsigned long long bits = c->length * 8ULL;
              unsigned char pad = 0x80;
              ra_sha256_update(c, &pad, 1);
              pad = 0;
              while (c->used != 56) {
                  ra_sha256_update(c, &pad, 1);
              }
              unsigned char len_bytes[8];
              for (int i = 0; i < 8; ++i) {
                  len_bytes[i] = (unsigned char)((bits >> (56 - 8 * i)) & 0xFF);
              }
              ra_sha256_update(c, len_bytes, 8);
              for (int i = 0; i < 8; ++i) {
                  for (int j = 0; j < 4; ++j) {
                      unsigned char b = (unsigned char)((c->state[i] >> (24 - 8 * j)) & 0xFF);
                      hex_out[i * 8 + j * 2] = hex[b >> 4];
                      hex_out[i * 8 + j * 2 + 1] = hex[b & 15];
                  }
              }
              hex_out[64] = 0;
          }

          /* ---------------- APK signing block ---------------- */

          static unsigned long ra_u32(unsigned char const *p)
          {
              return (unsigned long)p[0] | ((unsigned long)p[1] << 8) | ((unsigned long)p[2] << 16) | ((unsigned long)p[3] << 24);
          }

          static unsigned long long ra_u64(unsigned char const *p)
          {
              return (unsigned long long)ra_u32(p) | ((unsigned long long)ra_u32(p + 4) << 32);
          }

          /* On success writes the lowercase hex SHA-256 of the signer certificate and returns true.
           * Fails (false) when the APK has no v2/v3 block or more than one signer. */
          static bool ra_apk_cert_sha256(char const *path, char hex_out[65])
          {
              FILE *f = fopen(path, "rb");
              if (!f) {
                  return false;
              }
              bool ok = false;
              unsigned char *block = 0;
              do {
                  if (fseek(f, 0, SEEK_END) != 0) break;
                  long file_size = ftell(f);
                  if (file_size < 22) break;

                  long tail_len = file_size < 65557L ? file_size : 65557L;
                  unsigned char *tail = (unsigned char *)malloc((size_t)tail_len);
                  if (!tail) break;
                  bool tail_ok = fseek(f, file_size - tail_len, SEEK_SET) == 0 &&
                      fread(tail, 1, (size_t)tail_len, f) == (size_t)tail_len;
                  long eocd = -1;
                  if (tail_ok) {
                      for (long i = tail_len - 22; i >= 0; --i) {
                          if (tail[i] == 0x50 && tail[i+1] == 0x4b && tail[i+2] == 0x05 && tail[i+3] == 0x06) {
                              eocd = i;
                              break;
                          }
                      }
                  }
                  unsigned long cd_offset = eocd >= 0 ? ra_u32(tail + eocd + 16) : 0;
                  free(tail);
                  if (eocd < 0 || cd_offset < 32 || (long)cd_offset > file_size) break;

                  unsigned char footer[24];
                  if (fseek(f, (long)cd_offset - 24, SEEK_SET) != 0 || fread(footer, 1, 24, f) != 24) break;
                  if (memcmp(footer + 8, "APK Sig Block 42", 16) != 0) break;
                  unsigned long long block_size = ra_u64(footer);
                  if (block_size < 24 + 12 || block_size > 16ULL * 1024 * 1024 || block_size + 8 > cd_offset) break;

                  size_t pairs_len = (size_t)(block_size - 24);
                  block = (unsigned char *)malloc(pairs_len);
                  if (!block) break;
                  long pairs_start = (long)(cd_offset - block_size - 8 + 8);
                  if (fseek(f, pairs_start, SEEK_SET) != 0 || fread(block, 1, pairs_len, f) != pairs_len) break;

                  unsigned char const *value = 0;
                  size_t value_len = 0;
                  unsigned long found_id = 0;
                  size_t off = 0;
                  while (off + 12 <= pairs_len) {
                      unsigned long long len = ra_u64(block + off);
                      if (len < 4 || len > pairs_len - off - 8) break;
                      unsigned long id = ra_u32(block + off + 8);
                      if (id == 0xf05368c0UL || (id == 0x7109871aUL && found_id != 0xf05368c0UL)) {
                          found_id = id;
                          value = block + off + 12;
                          value_len = (size_t)(len - 4);
                      }
                      off += 8 + (size_t)len;
                  }
                  if (!value || value_len < 8) break;

                  /* signers: u32 length, then signer entries (exactly one allowed) */
                  unsigned long signers_len = ra_u32(value);
                  if (signers_len + 4 > value_len) break;
                  unsigned char const *signer_p = value + 4;
                  if (signers_len < 4) break;
                  unsigned long signer_len = ra_u32(signer_p);
                  if (signer_len + 4 != signers_len) break;           /* one signer only */
                  unsigned char const *signed_p = signer_p + 4;
                  if (signer_len < 4) break;
                  unsigned long signed_len = ra_u32(signed_p);
                  if (signed_len + 4 > signer_len) break;
                  unsigned char const *sd = signed_p + 4;
                  /* signed data: digests (u32 len + data), certificates (u32 len + data) */
                  if (signed_len < 8) break;
                  unsigned long digests_len = ra_u32(sd);
                  if (digests_len + 8 > signed_len) break;
                  unsigned char const *certs_p = sd + 4 + digests_len;
                  unsigned long certs_len = ra_u32(certs_p);
                  if (certs_len + 4 + 4 + digests_len > signed_len) break;
                  if (certs_len < 4) break;
                  unsigned long cert_len = ra_u32(certs_p + 4);
                  if (cert_len + 4 != certs_len) break;               /* one certificate only */

                  RaSha256 ctx;
                  ra_sha256_init(&ctx);
                  ra_sha256_update(&ctx, certs_p + 8, cert_len);
                  ra_sha256_final(&ctx, hex_out);
                  ok = true;
              } while (0);
              free(block);
              fclose(f);
              return ok;
          }

          #endif
          APKEOF
          cat > PORT/ANDROID/src/ra_signature_check.h <<'SIGEOF'
          #ifndef RA_SIGNATURE_CHECK_H
          #define RA_SIGNATURE_CHECK_H

          /* Generated by the build workflow: RA_EXPECTED_CERT_SHA256 = hex SHA-256 of the signing certificate. */
          #include "ra_sig_hash.h"
          #include "ra_apk_sig.h"

          #include <SDL.h>
          #include <jni.h>
          #include <android/log.h>
          #include <stdlib.h>
          #include <string.h>

          static bool ra_sig_clear(JNIEnv *env)
          {
              if (env->ExceptionCheck()) {
                  env->ExceptionClear();
                  return true;
              }
              return false;
          }

          static bool ra_sig_hash_matches(JNIEnv *env, jobject signature)
          {
              static char const *hex = "0123456789abcdef";
              jclass sig_cls = env->GetObjectClass(signature);
              jmethodID to_bytes = env->GetMethodID(sig_cls, "toByteArray", "()[B");
              jbyteArray cert = (jbyteArray)env->CallObjectMethod(signature, to_bytes);
              if (ra_sig_clear(env) || !cert) {
                  return false;
              }
              jclass md_cls = env->FindClass("java/security/MessageDigest");
              jmethodID get_instance = env->GetStaticMethodID(md_cls, "getInstance",
                  "(Ljava/lang/String;)Ljava/security/MessageDigest;");
              jstring algorithm = env->NewStringUTF("SHA-256");
              jobject md = env->CallStaticObjectMethod(md_cls, get_instance, algorithm);
              if (ra_sig_clear(env) || !md) {
                  return false;
              }
              jmethodID digest = env->GetMethodID(md_cls, "digest", "([B)[B");
              jbyteArray hash = (jbyteArray)env->CallObjectMethod(md, digest, cert);
              if (ra_sig_clear(env) || !hash || env->GetArrayLength(hash) != 32) {
                  return false;
              }
              jbyte bytes[32];
              env->GetByteArrayRegion(hash, 0, 32, bytes);
              char text[65];
              for (int i = 0; i < 32; ++i) {
                  unsigned char b = (unsigned char)bytes[i];
                  text[i * 2] = hex[b >> 4];
                  text[i * 2 + 1] = hex[b & 15];
              }
              text[64] = 0;
              return strcmp(text, RA_EXPECTED_CERT_SHA256) == 0;
          }

          static bool ra_pm_signature_ok(JNIEnv *env, jobject activity)
          {
              jclass act_cls = env->GetObjectClass(activity);
              jmethodID get_pm = env->GetMethodID(act_cls, "getPackageManager", "()Landroid/content/pm/PackageManager;");
              jmethodID get_pkg = env->GetMethodID(act_cls, "getPackageName", "()Ljava/lang/String;");
              jobject pm = env->CallObjectMethod(activity, get_pm);
              jstring pkg = (jstring)env->CallObjectMethod(activity, get_pkg);
              if (ra_sig_clear(env) || !pm || !pkg) {
                  return false;
              }
              jclass pm_cls = env->GetObjectClass(pm);
              jmethodID get_pi = env->GetMethodID(pm_cls, "getPackageInfo",
                  "(Ljava/lang/String;I)Landroid/content/pm/PackageInfo;");

              /* Android 9+ : PackageInfo.signingInfo (GET_SIGNING_CERTIFICATES = 0x08000000) */
              jobject info = env->CallObjectMethod(pm, get_pi, pkg, (jint)0x08000000);
              if (!ra_sig_clear(env) && info) {
                  jclass info_cls = env->GetObjectClass(info);
                  jfieldID si_field = env->GetFieldID(info_cls, "signingInfo", "Landroid/content/pm/SigningInfo;");
                  if (!ra_sig_clear(env) && si_field) {
                      jobject si = env->GetObjectField(info, si_field);
                      if (si) {
                          jclass si_cls = env->GetObjectClass(si);
                          jmethodID get_signers = env->GetMethodID(si_cls, "getApkContentsSigners",
                              "()[Landroid/content/pm/Signature;");
                          jobjectArray signers = (jobjectArray)env->CallObjectMethod(si, get_signers);
                          if (!ra_sig_clear(env) && signers && env->GetArrayLength(signers) == 1) {
                              jobject one = env->GetObjectArrayElement(signers, 0);
                              return one && ra_sig_hash_matches(env, one);
                          }
                          return false;
                      }
                  }
              }

              /* Older Android: PackageInfo.signatures (GET_SIGNATURES = 0x40) */
              info = env->CallObjectMethod(pm, get_pi, pkg, (jint)0x40);
              if (ra_sig_clear(env) || !info) {
                  return false;
              }
              jclass info_cls = env->GetObjectClass(info);
              jfieldID sigs_field = env->GetFieldID(info_cls, "signatures", "[Landroid/content/pm/Signature;");
              if (ra_sig_clear(env) || !sigs_field) {
                  return false;
              }
              jobjectArray sigs = (jobjectArray)env->GetObjectField(info, sigs_field);
              if (!sigs || env->GetArrayLength(sigs) != 1) {
                  return false;
              }
              jobject one = env->GetObjectArrayElement(sigs, 0);
              return one && ra_sig_hash_matches(env, one);
          }

          static bool ra_file_signature_ok(JNIEnv *env, jobject activity)
          {
              jclass act_cls = env->GetObjectClass(activity);
              jmethodID get_path = env->GetMethodID(act_cls, "getPackageCodePath", "()Ljava/lang/String;");
              jstring path = (jstring)env->CallObjectMethod(activity, get_path);
              if (ra_sig_clear(env) || !path) {
                  return false;
              }
              char const *utf = env->GetStringUTFChars(path, 0);
              if (!utf) {
                  return false;
              }
              char hex[65];
              bool ok = ra_apk_cert_sha256(utf, hex) && strcmp(hex, RA_EXPECTED_CERT_SHA256) == 0;
              env->ReleaseStringUTFChars(path, utf);
              return ok;
          }

          static bool ra_signature_ok(void)
          {
              JNIEnv *env = (JNIEnv *)SDL_AndroidGetJNIEnv();
              jobject activity = (jobject)SDL_AndroidGetActivity();
              if (!env || !activity) {
                  return false;
              }
              /* Both must agree: the certificate read straight from the APK file and the one PackageManager reports. */
              return ra_file_signature_ok(env, activity) && ra_pm_signature_ok(env, activity);
          }

          static void ra_verify_signature_or_exit(void)
          {
              if (!ra_signature_ok()) {
                  __android_log_print(ANDROID_LOG_ERROR, "RedAlert", "Invalid APK signature");
                  SDL_ShowSimpleMessageBox(SDL_MESSAGEBOX_ERROR, "Berlions", "Invalid APK signature", NULL);
                  exit(1);
              }
          }

          #endif
          SIGEOF
          python3 - <<'PYEOF'
          p = "PORT/ANDROID/src/android_main.cpp"
          s = open(p, encoding="utf-8").read()
          a = "#include <windows.h>"
