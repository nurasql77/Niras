name: Build APK

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Google Drive APK file ID"
        required: true
        default: "1QedxHN_bVYlr_2lEHqKig0IEXd47fzzx"

      english:
        description: "Overlay English files"
        required: true
        default: "false"

      app_name:
        description: "App name"
        required: true
        default: "Berlions"

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"
  GRADLE_VERSION: "9.4.1"
  SDL_VERSION: "2.32.10"

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:

      # --------------------------------------------------
      # SOURCE
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # JAVA
      # --------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # --------------------------------------------------
      # ANDROID SDK
      # --------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"


      # --------------------------------------------------
      # ACCEPT LICENSES
      # --------------------------------------------------

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true


      # --------------------------------------------------
      # INSTALL SDK / NDK / CMAKE
      # --------------------------------------------------

      - name: Install Android SDK packages
        run: |
          set -e

          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          yes | sdkmanager --licenses || true

          echo "Installed Android SDK packages:"
          sdkmanager --list_installed | head -100


      # --------------------------------------------------
      # GRADLE
      # --------------------------------------------------

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # --------------------------------------------------
      # CHECK TOOLS
      # --------------------------------------------------

      - name: Check build tools
        run: |
          set -e

          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          gradle --version

          echo
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo
          echo "NDK:"
          ls -la "$ANDROID_HOME/ndk/${NDK_VERSION}"

          echo
          echo "CMake:"
          "$ANDROID_HOME/cmake/${CMAKE_VERSION}/bin/cmake" --version


      # --------------------------------------------------
      # DOWNLOAD GAME DATA
      # --------------------------------------------------

      - name: Download game data
        env:
          FILE_ID: ${{ inputs.drive_file_id }}
          ENGLISH: ${{ inputs.english }}

        run: |
          set -e

          python3 -m pip install --upgrade gdown

          echo "Downloading source APK..."

          gdown \
            "https://drive.google.com/uc?id=${FILE_ID}" \
            -O source.apk

          test -s source.apk

          echo
          echo "Source APK:"
          ls -lh source.apk

          mkdir -p assets/redalert
          mkdir -p tmp

          echo
          echo "Extracting Red Alert data..."

          unzip -q source.apk \
            'assets/mobsik/*.zip' \
            -d tmp

          test -f \
            tmp/assets/mobsik/red-alert-data.zip

          unzip -q -o \
            tmp/assets/mobsik/red-alert-data.zip \
            -d assets/redalert

          if [ "$ENGLISH" = "true" ]; then
            echo "Applying English data..."

            test -f \
              tmp/assets/mobsik/red-alert-data-en.zip

            unzip -q -o \
              tmp/assets/mobsik/red-alert-data-en.zip \
              -d assets/redalert
          fi

          echo
          echo "Checking required Red Alert files..."

          test -f \
            assets/redalert/allies/INSTALL/REDALERT.INI

          echo "REDALERT.INI found."

          echo
          echo "Red Alert data size:"
          du -sh assets/redalert

          echo
          echo "Removing temporary files..."

          rm -rf source.apk
          rm -rf tmp


      # --------------------------------------------------
      # DOWNLOAD SDL2
      # --------------------------------------------------

      - name: Download SDL2
        run: |
          set -e

          mkdir -p android/third_party

          echo "Downloading SDL ${SDL_VERSION}..."

          curl -fL \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz" \
            -o /tmp/SDL2.tar.gz

          test -s /tmp/SDL2.tar.gz

          echo "Extracting SDL..."

          tar -xzf \
            /tmp/SDL2.tar.gz \
            -C android/third_party

          test -d \
            "android/third_party/SDL2-${SDL_VERSION}"

          rm -rf android/third_party/SDL

          mv \
            "android/third_party/SDL2-${SDL_VERSION}" \
            android/third_party/SDL

          echo
          echo "SDL directory:"
          ls -la android/third_party/SDL | head -30


      # --------------------------------------------------
      # CHECK PROJECT
      # --------------------------------------------------

      - name: Check Android project
        run: |
          set -e

          echo "Android project:"
          find android -maxdepth 3 -type f | sort | head -200

          echo
          echo "Red Alert assets:"
          test -f \
            assets/redalert/allies/INSTALL/REDALERT.INI

          echo
          echo "CMake:"
          test -f \
            android/app/CMakeLists.txt

          echo
          echo "Gradle:"
          test -f \
            android/app/build.gradle.kts


      # --------------------------------------------------
      # SET APPLICATION NAME
      # --------------------------------------------------

      - name: Set application name
        env:
          APP_NAME: ${{ inputs.app_name }}

        run: |
          set -e

          sed -i \
            "s|android:label=\"Red Alert\"|android:label=\"${APP_NAME}\"|" \
            android/app/src/main/AndroidManifest.xml

          grep 'android:label' \
            android/app/src/main/AndroidManifest.xml


      # --------------------------------------------------
      # BUILD
      # --------------------------------------------------

      - name: Build APK
        run: |
          set -e

          gradle \
            -p android \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info


      # --------------------------------------------------
      # VERIFY APK
      # --------------------------------------------------

      - name: Verify APK
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo
          echo "APK successfully created:"
          ls -lh "$APK"

          echo
          echo "APK SHA256:"
          sha256sum "$APK"


      # --------------------------------------------------
      # UPLOAD
      # --------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: redalert-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7