name: Build APK

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Google Drive APK file ID"
        required: true
        default: "14UV16nRMrBgQmKVxNbKrEov7bQXnkjMn"
      english:
        description: "Overlay English files"
        required: true
        default: "false"
      app_name:
        description: "App name"
        required: true
        default: "Berlions"

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"
  GRADLE_VERSION: "9.4.1"
  SDL_VERSION: "2.32.10"

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          set -e
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          yes | sdkmanager --licenses || true
          echo "Installed packages:"
          sdkmanager --list_installed | head -50

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Check build tools
        run: |
          set -e
          echo "Java:"
          java -version
          echo
          echo "Gradle:"
          gradle --version
          echo
          echo "Android SDK: $ANDROID_HOME"
          echo
          echo "NDK check:"
          ls -la "$ANDROID_HOME/ndk/28.2.13676358" | head -5
          echo
          echo "CMake check:"
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --version

      - name: Download game data
        env:
          FILE_ID: ${{ inputs.drive_file_id }}
          ENGLISH: ${{ inputs.english }}
        run: |
          set -e
          python3 -m pip install --upgrade gdown
          echo "Downloading source APK..."
          gdown "https://drive.google.com/uc?id=${FILE_ID}" -O source.apk
          test -s source.apk
          ls -lh source.apk
          mkdir -p assets/redalert tmp
          echo "Extracting Red Alert data..."
          unzip -q source.apk 'assets/mobsik/*.zip' -d tmp
          test -f tmp/assets/mobsik/red-alert-data.zip
          unzip -q -o tmp/assets/mobsik/red-alert-data.zip -d assets/redalert
          if [ "$ENGLISH" = "true" ]; then
            echo "Applying English data..."
            test -f tmp/assets/mobsik/red-alert-data-en.zip
            unzip -q -o tmp/assets/mobsik/red-alert-data-en.zip -d assets/redalert
          fi
          test -f assets/redalert/allies/INSTALL/REDALERT.INI
          echo "REDALERT.INI found."
          du -sh assets/redalert
          rm -rf source.apk tmp

      - name: Download SDL2
        run: |
          set -e
          mkdir -p android/third_party
          echo "Downloading SDL 2.32.10..."
          curl -fL "https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz" -o /tmp/SDL2.tar.gz
          test -s /tmp/SDL2.tar.gz
          tar -xzf /tmp/SDL2.tar.gz -C android/third_party
          rm -rf android/third_party/SDL
          mv android/third_party/SDL2-2.32.10 android/third_party/SDL
          ls -la android/third_party/SDL | head -10

      - name: Check Android project
        run: |
          set -e
          test -f assets/redalert/allies/INSTALL/REDALERT.INI
          test -f android/app/CMakeLists.txt
          test -f android/app/build.gradle.kts
          echo "Project checks passed."

      - name: Set application name
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -e
          sed -i "s|android:label=\"Red Alert\"|android:label=\"${APP_NAME}\"|" android/app/src/main/AndroidManifest.xml
          grep 'android:label' android/app/src/main/AndroidManifest.xml

      - name: Add touch controls
        run: |
          set -e
          D=android/app/src/main/java/com/raport/redalert
          cat > "$D/TouchControls.java" <<'JAVAEOF'
          package com.raport.redalert;

          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.os.SystemClock;
          import android.util.DisplayMetrics;
          import android.util.Log;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.InputDevice;
          import android.view.KeyCharacterMap;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import org.libsdl.app.SDLActivity;

          /** On-screen touch buttons that send the game's own hotkeys. */
          final class TouchControls {
              private static final String TAG = "TouchControls";

              private final Activity activity;
              private final FrameLayout panel;

              static void attach(Activity activity) {
                  try {
                      new TouchControls(activity);
                  } catch (Throwable t) {
                      Log.e(TAG, "Touch controls failed to attach", t);
                  }
              }

              private TouchControls(Activity a) {
                  activity = a;
                  FrameLayout root = new FrameLayout(a);
                  panel = new FrameLayout(a);
                  root.addView(panel, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  int cell = dp(52);
                  int gap = dp(4);
                  int left = dp(28);
                  int bottom = dp(12);
                  int top = dp(12);

                  // Top-left: Menu (Esc) and HUD (hide/show the buttons)
                  TextView menu = makeKeyButton("\u041c\u0435\u043d\u044e", KeyEvent.KEYCODE_ESCAPE, 13);
                  panel.addView(menu, params(dp(72), cell, Gravity.TOP | Gravity.START, left, top, 0, 0));

                  TextView hud = makeButton("HUD", 13);
                  hud.setOnTouchListener(new View.OnTouchListener() {
                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          if (e.getAction() == MotionEvent.ACTION_DOWN) {
                              panel.setVisibility(panel.getVisibility() == View.VISIBLE ? View.GONE : View.VISIBLE);
                          }
                          return true;
                      }
                  });
                  root.addView(hud, params(dp(60), cell, Gravity.TOP | Gravity.START,
                      left + dp(72) + gap * 2, top, 0, 0));

                  // Bottom-left: scroll pad (arrow keys)
                  panel.addView(makeKeyButton("\u25C0", KeyEvent.KEYCODE_DPAD_LEFT, 20),
                      params(cell, cell, Gravity.BOTTOM | Gravity.START, left, 0, 0, bottom));
                  panel.addView(makeKeyButton("\u25BC", KeyEvent.KEYCODE_DPAD_DOWN, 20),
                      params(cell, cell, Gravity.BOTTOM | Gravity.START, left + cell + gap, 0, 0, bottom));
                  panel.addView(makeKeyButton("\u25B6", KeyEvent.KEYCODE_DPAD_RIGHT, 20),
                      params(cell, cell, Gravity.BOTTOM | Gravity.START, left + 2 * (cell + gap), 0, 0, bottom));
                  panel.addView(makeKeyButton("\u25B2", KeyEvent.KEYCODE_DPAD_UP, 20),
                      params(cell, cell, Gravity.BOTTOM | Gravity.START, left + cell + gap, 0, 0, bottom + cell + gap));

                  // Bottom-centre: All / Stop / Guard / Cancel
                  LinearLayout row = new LinearLayout(a);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  int w = dp(66);
                  row.addView(makeKeyButton("\u0412\u0441\u0435", KeyEvent.KEYCODE_E, 13), rowParams(w, cell, gap));
                  row.addView(makeKeyButton("\u0421\u0442\u043e\u043f", KeyEvent.KEYCODE_S, 13), rowParams(w, cell, gap));
                  row.addView(makeKeyButton("\u041e\u0445\u0440\u0430\u043d\u0430", KeyEvent.KEYCODE_G, 13), rowParams(w, cell, gap));

                  TextView cancel = makeButton("\u041e\u0442\u043c\u0435\u043d\u0430", 13);
                  cancel.setOnTouchListener(new View.OnTouchListener() {
                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          if (e.getAction() == MotionEvent.ACTION_DOWN) {
                              v.setAlpha(0.6f);
                              rightClick();
                          } else if (e.getAction() == MotionEvent.ACTION_UP || e.getAction() == MotionEvent.ACTION_CANCEL) {
                              v.setAlpha(1f);
                          }
                          return true;
                      }
                  });
                  row.addView(cancel, rowParams(w, cell, gap));

                  int screenW = a.getResources().getDisplayMetrics().widthPixels;
                  panel.addView(row, params(ViewGroup.LayoutParams.WRAP_CONTENT, cell,
                      Gravity.BOTTOM | Gravity.START, (int) (screenW * 0.36f), 0, 0, bottom));

                  a.addContentView(root, new ViewGroup.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
              }

              private TextView makeKeyButton(String label, final int keyCode, int sp) {
                  TextView b = makeButton(label, sp);
                  b.setOnTouchListener(new View.OnTouchListener() {
                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          int action = e.getAction();
                          if (action == MotionEvent.ACTION_DOWN) {
                              v.setAlpha(0.6f);
                              sendKey(keyCode, true);
                          } else if (action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_CANCEL) {
                              v.setAlpha(1f);
                              sendKey(keyCode, false);
                          }
                          return true;
                      }
                  });
                  return b;
              }

              private TextView makeButton(String label, int sp) {
                  TextView b = new TextView(activity);
                  b.setText(label);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(TypedValue.COMPLEX_UNIT_SP, sp);
                  b.setGravity(Gravity.CENTER);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(0xB3141A1F);
                  bg.setCornerRadius(dp(10));
                  b.setBackground(bg);
                  return b;
              }

              private void sendKey(int keyCode, boolean down) {
                  long t = SystemClock.uptimeMillis();
                  KeyEvent event = new KeyEvent(t, t,
                      down ? KeyEvent.ACTION_DOWN : KeyEvent.ACTION_UP, keyCode, 0, 0,
                      KeyCharacterMap.VIRTUAL_KEYBOARD, 0, 0, InputDevice.SOURCE_KEYBOARD);
                  activity.dispatchKeyEvent(event);
              }

              /** Right mouse click (deselect / cancel) in the middle of the map area. */
              private void rightClick() {
                  DisplayMetrics dm = activity.getResources().getDisplayMetrics();
                  float x = dm.widthPixels * 0.4f;
                  float y = dm.heightPixels * 0.5f;
                  SDLActivity.onNativeMouse(2, MotionEvent.ACTION_DOWN, x, y, false);
                  SDLActivity.onNativeMouse(0, MotionEvent.ACTION_UP, x, y, false);
              }

              private int dp(int value) {
                  return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, value,
                      activity.getResources().getDisplayMetrics());
              }

              private static FrameLayout.LayoutParams params(int w, int h, int gravity,
                                                             int l, int t, int r, int b) {
                  FrameLayout.LayoutParams p = new FrameLayout.LayoutParams(w, h, gravity);
                  p.setMargins(l, t, r, b);
                  return p;
              }

              private static LinearLayout.LayoutParams rowParams(int w, int h, int gap) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(w, h);
                  p.setMargins(gap, 0, gap, 0);
                  return p;
              }
          }
          JAVAEOF
          python3 - <<'PYEOF'
          p = "android/app/src/main/java/com/raport/redalert/RedAlertActivity.java"
          s = open(p, encoding="utf-8").read()
          needle = "super.onCreate(savedInstanceState);"
          assert needle in s, "onCreate not found"
          s = s.replace(needle, needle + "\n        TouchControls.attach(this);", 1)
          open(p, "w", encoding="utf-8").write(s)
          PYEOF
          grep -n "TouchControls" "$D/RedAlertActivity.java"

      - name: Build APK
        run: |
          set -e
          gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -e
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: redalert-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
