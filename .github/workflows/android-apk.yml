          p = "PORT/MAC/src/mac_sdl_runtime.cpp"
          s = open(p, encoding="utf-8").read()

          # 1) mouse path
          a = "\t\tSDL_GetWindowSize(MacWindow, &window_w, &window_h);\n\t}\n\treturn RA_CalculateAspectViewport(MacWidth, MacHeight, window_w, window_h);"
