name: Build APK

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Google Drive APK file ID"
        required: true
        default: "14UV16nRMrBgQmKVxNbKrEov7bQXnkjMn"

      english:
        description: "Overlay English files"
        required: true
        default: "false"

      app_name:
        description: "App name"
        required: true
        default: "Berlions"

      controls:
        description: "Enable touch controls"
        required: true
        default: "true"

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"
  GRADLE_VERSION: "9.4.1"
  SDL_VERSION: "2.32.10"

jobs:
  apk:
    runs-on: ubuntu-24.04

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Java
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # --------------------------------------------------
      # Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"


      # --------------------------------------------------
      # Android packages
      # --------------------------------------------------
      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          yes | sdkmanager --licenses || true


      # --------------------------------------------------
      # Gradle
      # --------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # --------------------------------------------------
      # Download Red Alert data
      # --------------------------------------------------
      - name: Download game data
        env:
          FILE_ID: ${{ inputs.drive_file_id }}
          ENGLISH: ${{ inputs.english }}
        run: |
          set -e

          python3 -m pip install --upgrade gdown

          gdown \
            "https://drive.google.com/uc?id=${FILE_ID}" \
            -O source.apk

          mkdir -p assets/redalert tmp

          unzip -q source.apk \
            'assets/mobsik/*.zip' \
            -d tmp

          unzip -q -o \
            tmp/assets/mobsik/red-alert-data.zip \
            -d assets/redalert

          if [ "$ENGLISH" = "true" ]; then
            unzip -q -o \
              tmp/assets/mobsik/red-alert-data-en.zip \
              -d assets/redalert
          fi

          test -f \
            assets/redalert/allies/INSTALL/REDALERT.INI

          rm -rf source.apk tmp

          echo "Game data:"
          du -sh assets/redalert


      # --------------------------------------------------
      # Download SDL2
      # --------------------------------------------------
      - name: Download SDL2
        run: |
          set -e

          mkdir -p android/third_party

          curl -fL \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz" \
            -o /tmp/SDL2.tar.gz

          tar -xzf /tmp/SDL2.tar.gz \
            -C android/third_party

          mv \
            "android/third_party/SDL2-${SDL_VERSION}" \
            android/third_party/SDL


      # --------------------------------------------------
      # Check project
      # --------------------------------------------------
      - name: Check project
        run: |
          set -e

          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/CMakeLists.txt

          echo "Project structure OK"


      # --------------------------------------------------
      # Set application name
      # --------------------------------------------------
      - name: Set application name
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -e

          sed -i \
            "s|android:label=\"Red Alert\"|android:label=\"${APP_NAME}\"|" \
            android/app/src/main/AndroidManifest.xml

          grep 'android:label=' \
            android/app/src/main/AndroidManifest.xml


      # --------------------------------------------------
      # CHECK KEYSTORE
      # --------------------------------------------------
      - name: Check signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          echo "======================================"
          echo "CHECKING SIGNING KEY"
          echo "======================================"

          echo "1. Checking secrets..."

          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: KEYSTORE_B64 is empty"
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is empty"
            exit 1
          fi

          echo "KEYSTORE_B64: present"
          echo "KEYSTORE_PASSWORD: present"


          echo ""
          echo "2. Checking Base64 length..."

          B64_LENGTH=$(printf '%s' "$KEYSTORE_B64" | wc -c)

          echo "Base64 length: ${B64_LENGTH} characters"

          if [ "$B64_LENGTH" -lt 100 ]; then
            echo "ERROR: KEYSTORE_B64 is suspiciously short"
            exit 1
          fi


          echo ""
          echo "3. Decoding PKCS12..."

          KS="$RUNNER_TEMP/release.p12"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"


          echo ""
          echo "4. Checking decoded file..."

          if [ ! -s "$KS" ]; then
            echo "ERROR: decoded keystore is empty"
            exit 1
          fi

          KS_SIZE=$(stat -c%s "$KS")

          echo "Keystore size: ${KS_SIZE} bytes"

          file "$KS"


          echo ""
          echo "5. Checking PKCS12 with keytool..."

          if ! keytool -list \
            -keystore "$KS" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            > /tmp/keytool-output.txt \
            2> /tmp/keytool-error.txt
          then

            echo ""
            echo "======================================"
            echo "KEYSTORE CHECK FAILED"
            echo "======================================"

            echo ""
            echo "keytool error:"

            cat /tmp/keytool-error.txt

            echo ""
            echo "Possible causes:"
            echo "1. KEYSTORE_PASSWORD does not match this PKCS12 file."
            echo "2. KEYSTORE_B64 belongs to another .p12 file."
            echo "3. KEYSTORE_B64 is incomplete."
            echo "4. The decoded file is not a valid PKCS12 keystore."

            echo ""
            echo "Safe diagnostic SHA256:"

            sha256sum "$KS"

            exit 1
          fi


          echo ""
          echo "6. Keystore contents:"

          cat /tmp/keytool-output.txt


          echo ""
          echo "7. Searching for PrivateKeyEntry..."

          ALIAS=$(awk -F, \
            '/PrivateKeyEntry/ {print $1; exit}' \
            /tmp/keytool-output.txt)

          if [ -z "$ALIAS" ]; then
            echo "ERROR: No PrivateKeyEntry found"
            exit 1
          fi

          echo "Alias found: $ALIAS"


          echo ""
          echo "======================================"
          echo "SUCCESS: KEYSTORE IS VALID"
          echo "======================================"


      # --------------------------------------------------
      # Prepare signing key
      # --------------------------------------------------
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          KS="$RUNNER_TEMP/release.p12"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"

          ALIAS=$(keytool -list \
            -keystore "$KS" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            | awk -F, '/PrivateKeyEntry/ {print $1; exit}')

          test -n "$ALIAS"

          FP=$(keytool -list -v \
            -keystore "$KS" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$ALIAS" \
            | awk '/SHA256:/ {print $2; exit}' \
            | tr -d ':' \
            | tr 'A-F' 'a-f')

          test "${#FP}" -eq 64

          echo "KS_PATH=$KS" >> "$GITHUB_ENV"
          echo "KS_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "KS_FP=$FP" >> "$GITHUB_ENV"

          printf \
            '#define RA_EXPECTED_CERT_SHA256 "%s"\n' \
            "$FP" \
            > PORT/ANDROID/src/ra_sig_hash.h

          echo "Certificate SHA-256: $FP"


      # --------------------------------------------------
      # Touch controls
      # --------------------------------------------------
      - name: Add touch controls
        if: ${{ inputs.controls == 'true' }}
        run: |
          set -e

          mkdir -p android/app/src/main/java/com/ra/port

          cat > android/app/src/main/java/com/ra/port/TouchControls.java <<'EOF'
          package com.ra.port;

          import android.app.Activity;
          import android.view.View;
          import android.view.MotionEvent;
          import android.graphics.Color;
          import android.widget.FrameLayout;
          import android.widget.Button;

          public class TouchControls {

              public static void attach(Activity activity) {

                  FrameLayout root =
                      activity.findViewById(android.R.id.content);

                  Button left = new Button(activity);
                  left.setText("←");

                  Button right = new Button(activity);
                  right.setText("→");

                  Button up = new Button(activity);
                  up.setText("↑");

                  Button down = new Button(activity);
                  down.setText("↓");

                  Button action = new Button(activity);
                  action.setText("A");

                  FrameLayout.LayoutParams lp =
                      new FrameLayout.LayoutParams(180, 180);

                  lp.leftMargin = 30;
                  lp.topMargin = 30;

                  root.addView(left, lp);

                  FrameLayout.LayoutParams rp =
                      new FrameLayout.LayoutParams(180, 180);

                  rp.leftMargin = 220;
                  rp.topMargin = 30;

                  root.addView(right, rp);

                  FrameLayout.LayoutParams upLp =
                      new FrameLayout.LayoutParams(180, 180);

                  upLp.leftMargin = 125;
                  upLp.topMargin = 30;

                  root.addView(up, upLp);

                  FrameLayout.LayoutParams downLp =
                      new FrameLayout.LayoutParams(180, 180);

                  downLp.leftMargin = 125;
                  downLp.topMargin = 220;

                  root.addView(down, downLp);

                  FrameLayout.LayoutParams actionLp =
                      new FrameLayout.LayoutParams(200, 200);

                  actionLp.leftMargin = 850;
                  actionLp.topMargin = 250;

                  root.addView(action, actionLp);
              }
          }
          EOF

          sed -i \
            '/setContentView/a\
            com.ra.port.TouchControls.attach(this);' \
            android/app/src/main/java/com/ra/port/MainActivity.java || true


      # --------------------------------------------------
      # Build APK
      # --------------------------------------------------
      - name: Build APK
        run: |
          set -e

          gradle \
            -p android \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace


      # --------------------------------------------------
      # Sign APK
      # --------------------------------------------------
      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -f "$KS_PATH"

          echo "Signing APK..."

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$KS_PATH" \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --out "$RUNNER_TEMP/berlions-signed.apk" \
            "$APK"

          echo "APK signed successfully."


      # --------------------------------------------------
      # Verify APK
      # --------------------------------------------------
      - name: Verify APK
        run: |
          set -e

          APK="$RUNNER_TEMP/berlions-signed.apk"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK certificate SHA-256:"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --print-certs \
            "$APK"


      # --------------------------------------------------
      # Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: redalert-apk
          path: ${{ runner.temp }}/berlions-signed.apk
          retention-days: 7