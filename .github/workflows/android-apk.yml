name: Build APK

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Google Drive game-data APK file ID"
        required: true
        default: "14UV16nRMrBgQmKVxNbKrEov7bQXnkjMn"
      english:
        description: "Overlay English files"
        required: true
        default: "false"
      app_name:
        description: "App name"
        required: true
        default: "Berlions"
      controls:
        description: "Add on-screen controls"
        required: true
        default: "true"
      stretch:
        description: "Stretch picture to full screen"
        required: true
        default: "true"
      direct_touch:
        description: "Hide mouse cursor for touch input"
        required: true
        default: "true"

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"
  GRADLE_VERSION: "9.4.1"
  SDL_VERSION: "2.32.10"

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          set -e
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "${GRADLE_VERSION}"

      - name: Download game data
        env:
          FILE_ID: ${{ inputs.drive_file_id }}
          ENGLISH: ${{ inputs.english }}
        run: |
          set -e
          python3 -m pip install --upgrade gdown
          gdown "https://drive.google.com/uc?id=${FILE_ID}" -O source.apk
          test -s source.apk

          mkdir -p assets/redalert tmp
          unzip -q source.apk 'assets/mobsik/*.zip' -d tmp
          test -f tmp/assets/mobsik/red-alert-data.zip

          unzip -q -o tmp/assets/mobsik/red-alert-data.zip -d assets/redalert

          if [ "$ENGLISH" = "true" ]; then
            test -f tmp/assets/mobsik/red-alert-data-en.zip
            unzip -q -o tmp/assets/mobsik/red-alert-data-en.zip -d assets/redalert
          fi

          test -f assets/redalert/allies/INSTALL/REDALERT.INI
          rm -rf source.apk tmp

      - name: Download SDL2
        run: |
          set -e
          mkdir -p android/third_party
          curl -fL \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz" \
            -o /tmp/SDL2.tar.gz
          tar -xzf /tmp/SDL2.tar.gz -C android/third_party
          rm -rf android/third_party/SDL
          mv "android/third_party/SDL2-${SDL_VERSION}" android/third_party/SDL

      - name: Set application name
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -e
          sed -i \
            "s|android:label=\"Red Alert\"|android:label=\"${APP_NAME}\"|" \
            android/app/src/main/AndroidManifest.xml

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"

          KS="$RUNNER_TEMP/release.p12"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"

          ALIAS="$(
            keytool -list \
              -keystore "$KS" \
              -storetype PKCS12 \
              -storepass "$KEYSTORE_PASSWORD" |
            awk -F, '/PrivateKeyEntry/ {print $1; exit}'
          )"

          test -n "$ALIAS"

          FP="$(
            keytool -list -v \
              -keystore "$KS" \
              -storetype PKCS12 \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$ALIAS" |
            awk '/SHA256:/ {print $2; exit}' |
            tr -d ':' |
            tr 'A-F' 'a-f'
          )"

          test "${#FP}" -eq 64

          echo "KS_PATH=$KS" >> "$GITHUB_ENV"
          echo "KS_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "KS_FP=$FP" >> "$GITHUB_ENV"

      - name: Add SDL touch controls
        if: ${{ inputs.controls == 'true' }}
        run: |
          set -e

          D="android/app/src/main/java/com/raport/redalert"
          mkdir -p "$D"

          cat > "$D/TouchControls.java" <<'JAVA'
          package com.raport.redalert;

          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.os.SystemClock;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import org.libsdl.app.SDLActivity;

          final class TouchControls {
              private final Activity activity;
              private final FrameLayout panel;

              static void attach(Activity activity) {
                  try {
                      new TouchControls(activity);
                  } catch (Throwable ignored) {
                  }
              }

              private TouchControls(Activity activity) {
                  this.activity = activity;

                  FrameLayout root = new FrameLayout(activity);
                  panel = new FrameLayout(activity);

                  root.addView(
                      panel,
                      new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  );

                  int cell = dp(52);
                  int gap = dp(4);
                  int left = dp(24);
                  int bottom = dp(12);
                  int top = dp(12);

                  // Menu / ESC
                  panel.addView(
                      makeKeyButton("Меню", KeyEvent.KEYCODE_ESCAPE, 13),
                      params(dp(72), cell,
                          Gravity.TOP | Gravity.START,
                          left, top, 0, 0)
                  );

                  // HUD: hide/show controls. Help button intentionally omitted.
                  TextView hud = makeButton("HUD", 13);
                  hud.setOnClickListener(v -> {
                      int visibility =
                          panel.getVisibility() == View.VISIBLE
                              ? View.GONE
                              : View.VISIBLE;

                      panel.setVisibility(visibility);
                  });

                  root.addView(
                      hud,
                      params(dp(60), cell,
                          Gravity.TOP | Gravity.END,
                          0, top, left, 0)
                  );

                  // D-pad
                  panel.addView(
                      makeKeyButton("◀", KeyEvent.KEYCODE_DPAD_LEFT, 20),
                      params(cell, cell,
                          Gravity.BOTTOM | Gravity.START,
                          left, 0, 0, bottom)
                  );

                  panel.addView(
                      makeKeyButton("▼", KeyEvent.KEYCODE_DPAD_DOWN, 20),
                      params(cell, cell,
                          Gravity.BOTTOM | Gravity.START,
                          left + cell + gap, 0, 0, bottom)
                  );

                  panel.addView(
                      makeKeyButton("▶", KeyEvent.KEYCODE_DPAD_RIGHT, 20),
                      params(cell, cell,
                          Gravity.BOTTOM | Gravity.START,
                          left + 2 * (cell + gap), 0, 0, bottom)
                  );

                  panel.addView(
                      makeKeyButton("▲", KeyEvent.KEYCODE_DPAD_UP, 20),
                      params(cell, cell,
                          Gravity.BOTTOM | Gravity.START,
                          left + cell + gap, 0, 0,
                          bottom + cell + gap)
                  );

                  // Red Alert action keys used by the ready APK.
                  LinearLayout actions = new LinearLayout(activity);
                  actions.setOrientation(LinearLayout.HORIZONTAL);

                  int actionW = dp(66);

                  actions.addView(
                      makeKeyButton("Все", KeyEvent.KEYCODE_E, 13),
                      rowParams(actionW, cell, gap)
                  );

                  actions.addView(
                      makeKeyButton("Стоп", KeyEvent.KEYCODE_S, 13),
                      rowParams(actionW, cell, gap)
                  );

                  actions.addView(
                      makeKeyButton("Охрана", KeyEvent.KEYCODE_G, 13),
                      rowParams(actionW, cell, gap)
                  );

                  actions.addView(
                      makeKeyButton("Отмена", KeyEvent.KEYCODE_ESCAPE, 13),
                      rowParams(actionW, cell, gap)
                  );

                  panel.addView(
                      actions,
                      params(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          cell,
                          Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL,
                          0, 0, 0, bottom
                      )
                  );

                  activity.addContentView(
                      root,
                      new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  );
              }

              private TextView makeKeyButton(
                      String label,
                      final int keyCode,
                      int textSize
              ) {
                  TextView button = makeButton(label, textSize);

                  button.setOnTouchListener((v, event) -> {
                      switch (event.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              v.setAlpha(0.60f);
                              sendSDLKey(keyCode, true);
                              return true;

                          case MotionEvent.ACTION_UP:
                              v.setAlpha(1.0f);
                              sendSDLKey(keyCode, false);
                              v.performClick();
                              return true;

                          case MotionEvent.ACTION_CANCEL:
                              v.setAlpha(1.0f);
                              sendSDLKey(keyCode, false);
                              return true;
                      }

                      return true;
                  });

                  return button;
              }

              private TextView makeButton(String label, int textSize) {
                  TextView button = new TextView(activity);
                  button.setText(label);
                  button.setTextColor(Color.WHITE);
                  button.setTextSize(TypedValue.COMPLEX_UNIT_SP, textSize);
                  button.setGravity(Gravity.CENTER);

                  GradientDrawable background = new GradientDrawable();
                  background.setColor(0xB3141A1F);
                  background.setCornerRadius(dp(10));
                  button.setBackground(background);

                  return button;
              }

              private void sendSDLKey(int keyCode, boolean down) {
                  // The ready APK sends input through SDLActivity's native
                  // key bridge instead of Activity.dispatchKeyEvent().
                  try {
                      long time = SystemClock.uptimeMillis();

                      if (down) {
                          SDLActivity.onNativeKeyDown(keyCode);
                      } else {
                          SDLActivity.onNativeKeyUp(keyCode);
                      }

                      // Keep timestamp referenced so Android does not
                      // optimize away the timing operation.
                      if (time < 0) {
                          throw new IllegalStateException();
                      }
                  } catch (Throwable ignored) {
                  }
              }

              private int dp(int value) {
                  return (int) TypedValue.applyDimension(
                      TypedValue.COMPLEX_UNIT_DIP,
                      value,
                      activity.getResources().getDisplayMetrics()
                  );
              }

              private static FrameLayout.LayoutParams params(
                      int width,
                      int height,
                      int gravity,
                      int left,
                      int top,
                      int right,
                      int bottom
              ) {
                  FrameLayout.LayoutParams p =
                      new FrameLayout.LayoutParams(width, height, gravity);
                  p.setMargins(left, top, right, bottom);
                  return p;
              }

              private static LinearLayout.LayoutParams rowParams(
                      int width,
                      int height,
                      int gap
              ) {
                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(width, height);
                  p.setMargins(gap, 0, gap, 0);
                  return p;
              }
          }
          JAVA

          python3 - <<'PY'
          p = "android/app/src/main/java/com/raport/redalert/RedAlertActivity.java"
          s = open(p, encoding="utf-8").read()

          if "TouchControls.attach(this);" not in s:
              needle = "super.onCreate(savedInstanceState);"
              if needle not in s:
                  raise SystemExit("onCreate() not found in RedAlertActivity.java")
              s = s.replace(
                  needle,
                  needle + "\n        TouchControls.attach(this);",
                  1
              )
              open(p, "w", encoding="utf-8").write(s)

          print("SDL TouchControls attached.")

          PY

      - name: Stretch to full screen
        if: ${{ inputs.stretch == 'true' }}
        run: |
          set -e
          python3 - <<'PY'
          p = "PORT/MAC/include/ra_aspect_viewport.h"
          s = open(p, encoding="utf-8").read()

          needle = "\tif ((long long)target_w * source_h > (long long)target_h * source_w) {"

          if "viewport.w = target_w;" not in s:
              if needle not in s:
                  raise SystemExit("viewport code not found")

              stretch = (
                  "\tviewport.x = 0;\n"
                  "\tviewport.y = 0;\n"
                  "\tviewport.w = target_w;\n"
                  "\tviewport.h = target_h;\n"
                  "\treturn viewport;\n\n"
              )

              s = s.replace(needle, stretch + needle, 1)
              open(p, "w", encoding="utf-8").write(s)

          print("Full-screen stretch applied.")

          PY

      - name: Direct touch
        if: ${{ inputs.direct_touch == 'true' }}
        run: |
          set -e
          python3 - <<'PY'
          p = "PORT/MAC/src/mac_sdl_runtime.cpp"
          s = open(p, encoding="utf-8").read()

          s = s.replace(
              "MobileTouchCursorHidden = false",
              "MobileTouchCursorHidden = true"
          )

          open(p, "w", encoding="utf-8").write(s)
          print("Touch cursor hidden.")

          PY

      - name: Build APK
        run: |
          set -e
          gradle \
            -p android \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          BT="$ANDROID_HOME/build-tools/36.0.0"
          OUT="android/app/build/outputs/apk/debug"

          test -f "$OUT/app-debug.apk"

          "$BT/zipalign" \
            -f -p 4 \
            "$OUT/app-debug.apk" \
            "$RUNNER_TEMP/aligned.apk"

          "$BT/apksigner" sign \
            --ks "$KS_PATH" \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --key-pass "env:KEYSTORE_PASSWORD" \
            --out "$OUT/berlions-signed.apk" \
            "$RUNNER_TEMP/aligned.apk"

          "$BT/apksigner" verify \
            --verbose \
            --print-certs \
            "$OUT/berlions-signed.apk"

      - name: Verify APK
        run: |
          set -e
          APK="android/app/build/outputs/apk/debug/berlions-signed.apk"

          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: redalert-apk
          path: android/app/build/outputs/apk/debug/berlions-signed.apk
          if-no-files-found: error
          retention-days: 7
