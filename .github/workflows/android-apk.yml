      - name: Hide channel link in native code
        run: |
          set -e
          python3 - <<'PYEOF'
          import os
          fp = os.environ["KS_FP"].encode()
          def enc(text):
              data = text.encode("ascii")
              return ", ".join(str(c ^ fp[i % len(fp)]) for i, c in enumerate(data))
          url = "https://t.me/android_port"
          handle = "@android_port"
          header = """#ifndef RA_CHANNEL_H
          #define RA_CHANNEL_H

          /* Channel link kept inside the native library, obfuscated with the signing-certificate hash. */
          #include <jni.h>
          #include <stddef.h>
          #include <string.h>
          #include "ra_sig_hash.h"

          static unsigned char const ra_url_enc[] = { @URL@ };
          static unsigned char const ra_handle_enc[] = { @HANDLE@ };

          static jstring ra_decode_text(JNIEnv *env, unsigned char const *enc, size_t n)
          {
              char out[160];
              size_t klen = strlen(RA_EXPECTED_CERT_SHA256);
              if (n == 0 || n >= sizeof(out) || klen == 0) {
                  return env->NewStringUTF("");
              }
              for (size_t i = 0; i < n; ++i) {
                  unsigned char c = (unsigned char)(enc[i] ^ (unsigned char)RA_EXPECTED_CERT_SHA256[i % klen]);
                  if (c < 32 || c > 126) {
                      return env->NewStringUTF("");
                  }
                  out[i] = (char)c;
              }
              out[n] = 0;
              return env->NewStringUTF(out);
          }

          extern "C" JNIEXPORT jstring JNICALL Java_com_raport_redalert_TouchControls_nativeUrl(JNIEnv *env, jclass)
          {
              return ra_decode_text(env, ra_url_enc, sizeof(ra_url_enc));
          }

          extern "C" JNIEXPORT jstring JNICALL Java_com_raport_redalert_TouchControls_nativeHandle(JNIEnv *env, jclass)
          {
              return ra_decode_text(env, ra_handle_enc, sizeof(ra_handle_enc));
          }

          #endif
          """.replace("@URL@", enc(url)).replace("@HANDLE@", enc(handle))
          open("PORT/ANDROID/src/ra_channel.h", "w").write(header)

          p = "PORT/ANDROID/src/android_main.cpp"
          s = open(p, encoding="utf-8").read()
          a = '#include "ra_signature_check.h"'
          assert s.count(a) == 1, "signature include not found"
          s = s.replace(a, a + '\n#include "ra_channel.h"', 1)
          open(p, "w", encoding="utf-8").write(s)
          print("channel header written")
          PYEOF
          grep -n "ra_channel" PORT/ANDROID/src/android_main.cpp

