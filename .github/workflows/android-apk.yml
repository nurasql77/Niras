name: Build APK

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Google Drive APK file ID"
        required: true
        default: "14UV16nRMrBgQmKVxNbKrEov7bQXnkjMn"

      english:
        description: "Overlay English files"
        required: true
        default: "false"

      app_name:
        description: "App name"
        required: true
        default: "Berlions"

      controls:
        description: "Add on-screen buttons (true/false)"
        required: true
        default: "true"

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"
  GRADLE_VERSION: "9.4.1"
  SDL_VERSION: "2.32.10"

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # JAVA
      # --------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # --------------------------------------------------
      # ANDROID SDK
      # --------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"


      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true


      - name: Install Android SDK packages
        run: |
          set -e

          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          yes | sdkmanager --licenses || true

          echo "Installed Android packages:"
          sdkmanager --list_installed | head -100


      # --------------------------------------------------
      # GRADLE
      # --------------------------------------------------

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # --------------------------------------------------
      # TOOLCHAIN CHECK
      # --------------------------------------------------

      - name: Check build tools
        run: |
          set -e

          echo "=============================="
          echo "Java"
          echo "=============================="
          java -version

          echo
          echo "=============================="
          echo "Gradle"
          echo "=============================="
          gradle --version

          echo
          echo "=============================="
          echo "Android SDK"
          echo "=============================="
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo
          echo "=============================="
          echo "NDK"
          echo "=============================="

          test -d "$ANDROID_HOME/ndk/${NDK_VERSION}"

          ls -la "$ANDROID_HOME/ndk/${NDK_VERSION}" | head -10

          echo
          echo "=============================="
          echo "CMake"
          echo "=============================="

          "$ANDROID_HOME/cmake/${CMAKE_VERSION}/bin/cmake" --version


      # --------------------------------------------------
      # DOWNLOAD RED ALERT DATA
      # --------------------------------------------------

      - name: Download game data
        env:
          FILE_ID: ${{ inputs.drive_file_id }}
          ENGLISH: ${{ inputs.english }}
        run: |
          set -e

          python3 -m pip install --upgrade gdown

          echo "Downloading source APK..."

          gdown \
            "https://drive.google.com/uc?id=${FILE_ID}" \
            -O source.apk

          test -s source.apk

          echo "Downloaded source APK:"
          ls -lh source.apk

          mkdir -p assets/redalert
          mkdir -p tmp

          echo "Extracting Red Alert data..."

          unzip -q source.apk \
            'assets/mobsik/*.zip' \
            -d tmp

          test -f \
            tmp/assets/mobsik/red-alert-data.zip

          echo "Extracting red-alert-data.zip..."

          unzip -q -o \
            tmp/assets/mobsik/red-alert-data.zip \
            -d assets/redalert

          if [ "$ENGLISH" = "true" ]; then

            echo "Applying English data..."

            test -f \
              tmp/assets/mobsik/red-alert-data-en.zip

            unzip -q -o \
              tmp/assets/mobsik/red-alert-data-en.zip \
              -d assets/redalert

          fi

          test -f \
            assets/redalert/allies/INSTALL/REDALERT.INI

          echo "REDALERT.INI found."

          echo "Game data size:"
          du -sh assets/redalert

          rm -rf source.apk
          rm -rf tmp


      # --------------------------------------------------
      # SDL2
      # --------------------------------------------------

      - name: Download SDL2
        run: |
          set -e

          mkdir -p android/third_party

          echo "Downloading SDL ${SDL_VERSION}..."

          curl -fL \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz" \
            -o /tmp/SDL2.tar.gz

          test -s /tmp/SDL2.tar.gz

          tar -xzf \
            /tmp/SDL2.tar.gz \
            -C android/third_party

          rm -rf android/third_party/SDL

          mv \
            "android/third_party/SDL2-${SDL_VERSION}" \
            android/third_party/SDL

          echo "SDL directory:"
          ls -la android/third_party/SDL | head -20


      # --------------------------------------------------
      # PROJECT CHECK
      # --------------------------------------------------

      - name: Check Android project
        run: |
          set -e

          test -f \
            assets/redalert/allies/INSTALL/REDALERT.INI

          test -f \
            android/app/CMakeLists.txt

          test -f \
            android/app/build.gradle.kts

          test -f \
            android/build.gradle.kts

          test -f \
            android/settings.gradle.kts

          test -f \
            android/app/src/main/AndroidManifest.xml

          echo "Project checks passed."


      # --------------------------------------------------
      # APP NAME
      # --------------------------------------------------

      - name: Set application name
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -e

          sed -i \
            "s|android:label=\"Red Alert\"|android:label=\"${APP_NAME}\"|" \
            android/app/src/main/AndroidManifest.xml

          echo "Application name: ${APP_NAME}"

          grep \
            'android:label' \
            android/app/src/main/AndroidManifest.xml


      # --------------------------------------------------
      # SIGNING KEY
      # --------------------------------------------------

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          echo "Checking signing secrets..."

          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: KEYSTORE_B64 is empty."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is empty."
            exit 1
          fi

          echo "Secrets are present."

          KS="$RUNNER_TEMP/release.p12"

          echo "Decoding PKCS12 keystore..."

          echo "$KEYSTORE_B64" | base64 --decode > "$KS"

          if [ ! -s "$KS" ]; then
            echo "ERROR: decoded keystore is empty."
            exit 1
          fi

          echo "Keystore decoded successfully."

          echo "Checking PKCS12 keystore..."

          if ! keytool \
              -list \
              -keystore "$KS" \
              -storetype PKCS12 \
              -storepass "$KEYSTORE_PASSWORD" \
              >/dev/null 2>/tmp/keytool.err
          then

            echo "ERROR: keytool cannot open the PKCS12 keystore."

            echo "Check that:"
            echo "1. KEYSTORE_B64 contains the complete Base64."
            echo "2. KEYSTORE_PASSWORD is correct."
            echo "3. The file is actually PKCS12."

            exit 1
          fi

          echo "PKCS12 keystore opened successfully."


          # Find private key alias

          ALIAS=$(
            keytool \
              -list \
              -keystore "$KS" \
              -storetype PKCS12 \
              -storepass "$KEYSTORE_PASSWORD" |
            awk -F, '/PrivateKeyEntry/ {print $1; exit}'
          )

          if [ -z "$ALIAS" ]; then
            echo "ERROR: no PrivateKeyEntry found."
            exit 1
          fi

          echo "Private key entry found."


          # Get certificate SHA-256

          FP=$(
            keytool \
              -list \
              -v \
              -keystore "$KS" \
              -storetype PKCS12 \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$ALIAS" |
            awk '/SHA256:/ {print $2; exit}' |
            tr -d ':' |
            tr 'A-F' 'a-f'
          )

          if [ "${#FP}" -ne 64 ]; then
            echo "ERROR: invalid SHA-256 fingerprint."
            exit 1
          fi

          echo "Certificate fingerprint detected."

          echo "KS_PATH=$KS" >> "$GITHUB_ENV"
          echo "KS_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "KS_FP=$FP" >> "$GITHUB_ENV"

          mkdir -p PORT/ANDROID/src

          printf \
            '#define RA_EXPECTED_CERT_SHA256 "%s"\n' \
            "$FP" \
            > PORT/ANDROID/src/ra_sig_hash.h

          echo "Signing key prepared successfully."


      # --------------------------------------------------
      # SIGNATURE CHECK
      # --------------------------------------------------

      - name: Add signature check
        run: |
          set -e

          cat > PORT/ANDROID/src/ra_signature_check.h <<'SIGEOF'
          #ifndef RA_SIGNATURE_CHECK_H
          #define RA_SIGNATURE_CHECK_H

          #include "ra_sig_hash.h"

          #include <SDL.h>
          #include <jni.h>
          #include <android/log.h>
          #include <stdlib.h>
          #include <string.h>

          static bool ra_sig_clear(JNIEnv *env)
          {
              if (env->ExceptionCheck()) {
                  env->ExceptionClear();
                  return true;
              }

              return false;
          }

          static bool ra_sig_hash_matches(
              JNIEnv *env,
              jobject signature)
          {
              static const char *hex =
                  "0123456789abcdef";

              jclass sig_cls =
                  env->GetObjectClass(signature);

              jmethodID to_bytes =
                  env->GetMethodID(
                      sig_cls,
                      "toByteArray",
                      "()[B");

              if (!to_bytes) {
                  return false;
              }

              jbyteArray cert =
                  (jbyteArray)env->CallObjectMethod(
                      signature,
                      to_bytes);

              if (ra_sig_clear(env) || !cert) {
                  return false;
              }

              jclass md_cls =
                  env->FindClass(
                      "java/security/MessageDigest");

              if (!md_cls) {
                  return false;
              }

              jmethodID get_instance =
                  env->GetStaticMethodID(
                      md_cls,
                      "getInstance",
                      "(Ljava/lang/String;)Ljava/security/MessageDigest;");

              if (!get_instance) {
                  return false;
              }

              jstring algorithm =
                  env->NewStringUTF("SHA-256");

              jobject md =
                  env->CallStaticObjectMethod(
                      md_cls,
                      get_instance,
                      algorithm);

              if (ra_sig_clear(env) || !md) {
                  return false;
              }

              jmethodID digest =
                  env->GetMethodID(
                      md_cls,
                      "digest",
                      "([B)[B");

              if (!digest) {
                  return false;
              }

              jbyteArray hash =
                  (jbyteArray)env->CallObjectMethod(
                      md,
                      digest,
                      cert);

              if (ra_sig_clear(env) ||
                  !hash ||
                  env->GetArrayLength(hash) != 32)
              {
                  return false;
              }

              jbyte bytes[32];

              env->GetByteArrayRegion(
                  hash,
                  0,
                  32,
                  bytes);

              char text[65];

              for (int i = 0; i < 32; ++i) {

                  unsigned char b =
                      (unsigned char)bytes[i];

                  text[i * 2] =
                      hex[b >> 4];

                  text[i * 2 + 1] =
                      hex[b & 15];
              }

              text[64] = 0;

              return strcmp(
                  text,
                  RA_EXPECTED_CERT_SHA256) == 0;
          }


          static bool ra_signature_ok(void)
          {
              JNIEnv *env =
                  (JNIEnv *)SDL_AndroidGetJNIEnv();

              jobject activity =
                  (jobject)SDL_AndroidGetActivity();

              if (!env || !activity) {
                  return false;
              }

              jclass act_cls =
                  env->GetObjectClass(activity);

              jmethodID get_pm =
                  env->GetMethodID(
                      act_cls,
                      "getPackageManager",
                      "()Landroid/content/pm/PackageManager;");

              jmethodID get_pkg =
                  env->GetMethodID(
                      act_cls,
                      "getPackageName",
                      "()Ljava/lang/String;");

              if (!get_pm || !get_pkg) {
                  return false;
              }

              jobject pm =
                  env->CallObjectMethod(
                      activity,
                      get_pm);

              jstring pkg =
                  (jstring)env->CallObjectMethod(
                      activity,
                      get_pkg);

              if (ra_sig_clear(env) ||
                  !pm ||
                  !pkg)
              {
                  return false;
              }

              jclass pm_cls =
                  env->GetObjectClass(pm);

              jmethodID get_pi =
                  env->GetMethodID(
                      pm_cls,
                      "getPackageInfo",
                      "(Ljava/lang/String;I)Landroid/content/pm/PackageInfo;");

              if (!get_pi) {
                  return false;
              }


              /*
               * Android 9+
               *
               * GET_SIGNING_CERTIFICATES
               * = 0x08000000
               */

              jobject info =
                  env->CallObjectMethod(
                      pm,
                      get_pi,
                      pkg,
                      (jint)0x08000000);

              if (!ra_sig_clear(env) && info) {

                  jclass info_cls =
                      env->GetObjectClass(info);

                  jfieldID si_field =
                      env->GetFieldID(
                          info_cls,
                          "signingInfo",
                          "Landroid/content/pm/SigningInfo;");

                  if (!ra_sig_clear(env) && si_field) {

                      jobject si =
                          env->GetObjectField(
                              info,
                              si_field);

                      if (si) {

                          jclass si_cls =
                              env->GetObjectClass(si);

                          jmethodID get_signers =
                              env->GetMethodID(
                                  si_cls,
                                  "getApkContentsSigners",
                                  "()[Landroid/content/pm/Signature;");

                          if (!get_signers) {
                              return false;
                          }

                          jobjectArray signers =
                              (jobjectArray)env->CallObjectMethod(
                                  si,
                                  get_signers);

                          if (!ra_sig_clear(env) &&
                              signers &&
                              env->GetArrayLength(signers) == 1)
                          {
                              jobject one =
                                  env->GetObjectArrayElement(
                                      signers,
                                      0);

                              return one &&
                                  ra_sig_hash_matches(
                                      env,
                                      one);
                          }

                          return false;
                      }
                  }
              }


              /*
               * Older Android
               */

              info =
                  env->CallObjectMethod(
                      pm,
                      get_pi,
                      pkg,
                      (jint)0x40);

              if (ra_sig_clear(env) || !info) {
                  return false;
              }

              jclass info_cls =
                  env->GetObjectClass(info);

              jfieldID sigs_field =
                  env->GetFieldID(
                      info_cls,
                      "signatures",
                      "[Landroid/content/pm/Signature;");

              if (ra_sig_clear(env) ||
                  !sigs_field)
              {
                  return false;
              }

              jobjectArray sigs =
                  (jobjectArray)env->GetObjectField(
                      info,
                      sigs_field);

              if (!sigs ||
                  env->GetArrayLength(sigs) != 1)
              {
                  return false;
              }

              jobject one =
                  env->GetObjectArrayElement(
                      sigs,
                      0);

              return one &&
                  ra_sig_hash_matches(
                      env,
                      one);
          }


          static void ra_verify_signature_or_exit(void)
          {
              if (!ra_signature_ok()) {

                  __android_log_print(
                      ANDROID_LOG_ERROR,
                      "RedAlert",
                      "Invalid APK signature");

                  SDL_ShowSimpleMessageBox(
                      SDL_MESSAGEBOX_ERROR,
                      "Berlions",
                      "Invalid APK signature",
                      NULL);

                  exit(1);
              }
          }

          #endif
          SIGEOF


          python3 - <<'PYEOF'
          p = "PORT/ANDROID/src/android_main.cpp"

          s = open(
              p,
              encoding="utf-8"
          ).read()

          a = "#include <windows.h>"
          b = "    select_resource_root();"

          assert a in s, "windows.h include not found"
          assert b in s, "select_resource_root() not found"

          if '#include "ra_signature_check.h"' not in s:

              s = s.replace(
                  a,
                  a + '\n#include "ra_signature_check.h"',
                  1
              )

          if "ra_verify_signature_or_exit();" not in s:

              s = s.replace(
                  b,
                  "    ra_verify_signature_or_exit();\n" + b,
                  1
              )

          open(
              p,
              "w",
              encoding="utf-8"
          ).write(s)
          PYEOF

          echo "Signature check added."

          grep -n "ra_" \
            PORT/ANDROID/src/android_main.cpp


      # --------------------------------------------------
      # TOUCH CONTROLS
      # --------------------------------------------------

      - name: Add touch controls
        if: ${{ inputs.controls == 'true' }}
        run: |
          set -e

          D=android/app/src/main/java/com/raport/redalert

          mkdir -p "$D"

          cat > "$D/TouchControls.java" <<'JAVAEOF'
          package com.raport.redalert;

          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.os.SystemClock;
          import android.util.DisplayMetrics;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.InputDevice;
          import android.view.KeyCharacterMap;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import org.libsdl.app.SDLActivity;

          final class TouchControls {

              private static final String TAG =
                  "TouchControls";

              private final Activity activity;
              private final FrameLayout panel;

              static void attach(Activity activity) {

                  try {
                      new TouchControls(activity);
                  } catch (Throwable t) {
                      android.util.Log.e(
                          TAG,
                          "Touch controls failed",
                          t);
                  }
              }

              private TouchControls(Activity a) {

                  activity = a;

                  FrameLayout root =
                      new FrameLayout(a);

                  panel =
                      new FrameLayout(a);

                  root.addView(
                      panel,
                      new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  );


                  int cell = dp(52);
                  int gap = dp(4);

                  int left = dp(28);
                  int bottom = dp(12);
                  int top = dp(12);


                  TextView menu =
                      makeKeyButton(
                          "\u041c\u0435\u043d\u044e",
                          KeyEvent.KEYCODE_ESCAPE,
                          13
                      );

                  panel.addView(
                      menu,
                      params(
                          dp(72),
                          cell,
                          Gravity.TOP | Gravity.START,
                          left,
                          top,
                          0,
                          0
                      )
                  );


                  TextView hud =
                      makeButton(
                          "HUD",
                          13
                      );

                  hud.setOnClickListener(
                      v -> {

                          if (panel.getVisibility()
                              == View.VISIBLE) {

                              panel.setVisibility(
                                  View.GONE
                              );

                          } else {

                              panel.setVisibility(
                                  View.VISIBLE
                              );
                          }
                      }
                  );


                  root.addView(
                      hud,
                      params(
                          dp(60),
                          cell,
                          Gravity.TOP | Gravity.START,
                          left + dp(72) + gap * 2,
                          top,
                          0,
                          0
                      )
                  );


                  // Direction buttons

                  panel.addView(
                      makeKeyButton(
                          "\u25C0",
                          KeyEvent.KEYCODE_DPAD_LEFT,
                          20
                      ),
                      params(
                          cell,
                          cell,
                          Gravity.BOTTOM | Gravity.START,
                          left,
                          0,
                          0,
                          bottom
                      )
                  );


                  panel.addView(
                      makeKeyButton(
                          "\u25BC",
                          KeyEvent.KEYCODE_DPAD_DOWN,
                          20
                      ),
                      params(
                          cell,
                          cell,
                          Gravity.BOTTOM | Gravity.START,
                          left + cell + gap,
                          0,
                          0,
                          bottom
                      )
                  );


                  panel.addView(
                      makeKeyButton(
                          "\u25B6",
                          KeyEvent.KEYCODE_DPAD_RIGHT,
                          20
                      ),
                      params(
                          cell,
                          cell,
                          Gravity.BOTTOM | Gravity.START,
                          left + 2 * (cell + gap),
                          0,
                          0,
                          bottom
                      )
                  );


                  panel.addView(
                      makeKeyButton(
                          "\u25B2",
                          KeyEvent.KEYCODE_DPAD_UP,
                          20
                      ),
                      params(
                          cell,
                          cell,
                          Gravity.BOTTOM | Gravity.START,
                          left + cell + gap,
                          0,
                          0,
                          bottom + cell + gap
                      )
                  );


                  // Command buttons

                  LinearLayout row =
                      new LinearLayout(a);

                  row.setOrientation(
                      LinearLayout.HORIZONTAL
                  );

                  int w = dp(66);


                  row.addView(
                      makeKeyButton(
                          "\u0412\u0441\u0435",
                          KeyEvent.KEYCODE_E,
                          13
                      ),
                      rowParams(w, cell, gap)
                  );


                  row.addView(
                      makeKeyButton(
                          "\u0421\u0442\u043e\u043f",
                          KeyEvent.KEYCODE_S,
                          13
                      ),
                      rowParams(w, cell, gap)
                  );


                  row.addView(
                      makeKeyButton(
                          "\u041e\u0445\u0440\u0430\u043d\u0430",
                          KeyEvent.KEYCODE_G,
                          13
                      ),
                      rowParams(w, cell, gap)
                  );


                  row.addView(
                      makeKeyButton(
                          "\u041e\u0442\u043c\u0435\u043d\u0430",
                          KeyEvent.KEYCODE_ESCAPE,
                          13
                      ),
                      rowParams(w, cell, gap)
                  );


                  int screenW =
                      a.getResources()
                          .getDisplayMetrics()
                          .widthPixels;


                  panel.addView(
                      row,
                      params(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          cell,
                          Gravity.BOTTOM | Gravity.START,
                          (int)(screenW * 0.36f),
                          0,
                          0,
                          bottom
                      )
                  );


                  a.addContentView(
                      root,
                      new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  );
              }


              private TextView makeKeyButton(
                  String label,
                  final int keyCode,
                  int sp)
              {
                  TextView b =
                      makeButton(label, sp);

                  b.setOnTouchListener(
                      new View.OnTouchListener() {

                          @Override
                          public boolean onTouch(
                              View v,
                              MotionEvent e)
                          {
                              int action =
                                  e.getAction();

                              if (action ==
                                  MotionEvent.ACTION_DOWN)
                              {
                                  v.setAlpha(0.6f);
                                  sendKey(
                                      keyCode,
                                      true
                                  );

                              } else if (
                                  action ==
                                      MotionEvent.ACTION_UP ||
                                  action ==
                                      MotionEvent.ACTION_CANCEL)
                              {
                                  v.setAlpha(1f);
                                  sendKey(
                                      keyCode,
                                      false
                                  );
                              }

                              return true;
                          }
                      }
                  );

                  return b;
              }


              private TextView makeButton(
                  String label,
                  int sp)
              {
                  TextView b =
                      new TextView(activity);

                  b.setText(label);
                  b.setTextColor(Color.WHITE);

                  b.setTextSize(
                      TypedValue.COMPLEX_UNIT_SP,
                      sp
                  );

                  b.setGravity(
                      Gravity.CENTER
                  );

                  GradientDrawable bg =
                      new GradientDrawable();

                  bg.setColor(
                      0xB3141A1F
                  );

                  bg.setCornerRadius(
                      dp(10)
                  );

                  b.setBackground(bg);

                  return b;
              }


              private void sendKey(
                  int keyCode,
                  boolean down)
              {
                  long t =
                      SystemClock.uptimeMillis();

                  KeyEvent event =
                      new KeyEvent(
                          t,
                          t,
                          down
                              ? KeyEvent.ACTION_DOWN
                              : KeyEvent.ACTION_UP,
                          keyCode,
                          0,
                          0,
                          KeyCharacterMap.VIRTUAL_KEYBOARD,
                          0,
                          0,
                          InputDevice.SOURCE_KEYBOARD
                      );

                  activity.dispatchKeyEvent(
                      event
                  );
              }


              private int dp(int value)
              {
                  return (int)
