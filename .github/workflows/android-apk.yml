          s = s.replace(b, "\t\t\t\tMobileOnePan = 0;\n" + b, 1)

          # 3) finger motion: a quick one-finger drag on the map scrolls it
          c = "\t\t\t\tMobileTouchGestureOutput out;\n\t\t\t\tMobileTouchGesture_Move(&MobileTouch,"
          once(s, c)
          pan = (
          "\t\t\t\tif (MobileTouch.primary_active && !MobileTouch.secondary_active && !MobileTouch.left_down &&\n"
          "\t\t\t\t\t\t(long long)event.tfinger.fingerId == MobileTouch.primary_finger) {\n"
          "\t\t\t\t\tif (MobileOnePan) {\n"
          "\t\t\t\t\t\tmobile_emit_pan(event.tfinger.dx, event.tfinger.dy);\n"
          "\t\t\t\t\t\tMobileTouch.last_x = x;\n"
          "\t\t\t\t\t\tMobileTouch.last_y = y;\n"
          "\t\t\t\t\t\tbreak;\n"
          "\t\t\t\t\t}\n"
          "\t\t\t\t\tif (!InMovie && MobileTouchGesture_MovedPastSlop(&MobileTouch, x, y) &&\n"
          "\t\t\t\t\t\t\t(unsigned long)(mac_now_ms() - MobileTouch.down_tick) < 300UL &&\n"
          "\t\t\t\t\t\t\tMobileTouch.start_x < MacWidth - 160 && MobileTouch.start_y >= 16) {\n"
          "\t\t\t\t\t\tMobileOnePan = 1;\n"
          "\t\t\t\t\t\tMobileTouch.tap_cancelled = 1;\n"
          "\t\t\t\t\t\tMobilePan_Reset(&MobilePan);\n"
          "\t\t\t\t\t\tmobile_emit_pan(event.tfinger.dx, event.tfinger.dy);\n"
          "\t\t\t\t\t\tMobileTouch.last_x = x;\n"
          "\t\t\t\t\t\tMobileTouch.last_y = y;\n"
          "\t\t\t\t\t\tbreak;\n"
          "\t\t\t\t\t}\n"
          "\t\t\t\t}\n")
          s = s.replace(c, pan + c, 1)

          # 4) finger up: end of a scroll drag is not a tap
          d = "\t\t\t\tif (InMovie && MobileTouchGesture_IsTapEnd("
          once(s, d)
          end = (
          "\t\t\t\tif (MobileOnePan) {\n"
          "\t\t\t\t\tMobileOnePan = 0;\n"
          "\t\t\t\t\tMobileTouchGesture_Init(&MobileTouch);\n"
          "\t\t\t\t\tMobilePan_Reset(&MobilePan);\n"
          "\t\t\t\t\tbreak;\n"
          "\t\t\t\t}\n")
          s = s.replace(d, end + d, 1)

          open(p, "w", encoding="utf-8").write(s)
          PYEOF
          grep -n "MobileOnePan" PORT/MAC/src/mac_sdl_runtime.cpp | head -12

