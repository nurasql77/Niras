          ICEOF
          cat > "$R/mipmap-anydpi-v26/ic_launcher.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          XMLEOF
          cat > "$R/values/ic_launcher_background.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#2B2926</color>
          </resources>
          XMLEOF
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label=|android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:label=|' "$M"
          grep -c 'android:icon=' "$M"
          G=android/app/build.gradle.kts
          sed -i 's/applicationId = "com.raport.redalert"/applicationId = "kz.base64E.redalert"/' "$G"
          grep -n 'applicationId' "$G"
          grep -q 'kz.base64E.redalert' "$G"

      - name: Build APK
        run: |
          set -e
          gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/36.0.0"
          OUT=android/app/build/outputs/apk/debug
          "$BT/zipalign" -f -p 4 "$OUT/app-debug.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS_PATH" --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "$OUT/berlions-signed.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT/berlions-signed.apk" | tee /tmp/certs.txt
          grep -qi "$KS_FP" /tmp/certs.txt

      - name: Verify APK
        run: |
          set -e
          APK="android/app/build/outputs/apk/debug/berlions-signed.apk"
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: redalert-apk
          path: android/app/build/outputs/apk/debug/berlions-signed.apk
          if-no-files-found: error
          retention-days: 7
