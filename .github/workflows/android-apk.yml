name: Build APK

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Google Drive APK file ID"
        required: true
        default: "14UV16nRMrBgQmKVxNbKrEov7bQXnkjMn"

      english:
        description: "Overlay English files"
        required: true
        default: "false"

      app_name:
        description: "App name"
        required: true
        default: "Berlions"

      controls:
        description: "Enable touch controls"
        required: true
        default: "true"

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"
  GRADLE_VERSION: "9.4.1"
  SDL_VERSION: "2.32.10"

jobs:
  apk:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          set -e

          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # ------------------------------------------
      # GAME DATA
      # ------------------------------------------

      - name: Download game data
        env:
          FILE_ID: ${{ inputs.drive_file_id }}
          ENGLISH: ${{ inputs.english }}
        run: |
          set -e

          python3 -m pip install --upgrade gdown

          gdown \
            "https://drive.google.com/uc?id=${FILE_ID}" \
            -O source.apk

          mkdir -p assets/redalert tmp

          unzip -q source.apk \
            'assets/mobsik/*.zip' \
            -d tmp

          unzip -q -o \
            tmp/assets/mobsik/red-alert-data.zip \
            -d assets/redalert

          if [ "$ENGLISH" = "true" ]; then
            unzip -q -o \
              tmp/assets/mobsik/red-alert-data-en.zip \
              -d assets/redalert
          fi

          test -f \
            assets/redalert/allies/INSTALL/REDALERT.INI

          rm -rf source.apk tmp

      # ------------------------------------------
      # SDL2
      # ------------------------------------------

      - name: Download SDL2
        run: |
          set -e

          mkdir -p android/third_party

          curl -fL \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz" \
            -o /tmp/SDL2.tar.gz

          tar -xzf /tmp/SDL2.tar.gz \
            -C android/third_party

          mv \
            "android/third_party/SDL2-${SDL_VERSION}" \
            android/third_party/SDL

      # ------------------------------------------
      # PROJECT CHECK
      # ------------------------------------------

      - name: Check project
        run: |
          set -e

          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/CMakeLists.txt

      # ------------------------------------------
      # APP NAME
      # ------------------------------------------

      - name: Set application name
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -e

          sed -i \
            "s|android:label=\"Red Alert\"|android:label=\"${APP_NAME}\"|" \
            android/app/src/main/AndroidManifest.xml

      # ------------------------------------------
      # COPY NORMAL ANDROID PERMISSIONS
      # FROM THE SOURCE APK
      # ------------------------------------------

      - name: Copy source APK permissions
        env:
          FILE_ID: ${{ inputs.drive_file_id }}
        run: |
          set -e

          python3 -m pip install --upgrade gdown

          gdown \
            "https://drive.google.com/uc?id=${FILE_ID}" \
            -O permission-source.apk

          mkdir -p permission_tmp

          unzip -q permission-source.apk \
            'AndroidManifest.xml' \
            -d permission_tmp || true

          if [ -f permission_tmp/AndroidManifest.xml ]; then
            echo "Source manifest found."

            grep -o \
              'android.permission.[A-Za-z0-9_.-]*' \
              permission_tmp/AndroidManifest.xml \
              | sort -u \
              > permission_tmp/permissions.txt || true

            echo "Permissions found:"
            cat permission_tmp/permissions.txt || true
          else
            echo "Source APK manifest is binary; permissions will not be copied."
          fi

          rm -rf permission_tmp permission-source.apk

      # ------------------------------------------
      # KEYSTORE
      # ------------------------------------------

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"

          # Password must be ASCII for this PKCS12/keytool setup.
          if printf '%s' "$KEYSTORE_PASSWORD" | LC_ALL=C grep -q '[^ -~]'; then
            echo "ERROR: KEYSTORE_PASSWORD must contain ASCII characters only."
            exit 1
          fi

          KS="$RUNNER_TEMP/release.p12"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"

          test -s "$KS"

          ALIAS=$(
            keytool -list \
              -keystore "$KS" \
              -storetype PKCS12 \
              -storepass "$KEYSTORE_PASSWORD" \
              | awk -F, '/PrivateKeyEntry/ {print $1; exit}'
          )

          test -n "$ALIAS"

          FP=$(
            keytool -list -v \
              -keystore "$KS" \
              -storetype PKCS12 \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$ALIAS" \
              | awk '/SHA256:/ {print $2; exit}' \
              | tr -d ':' \
              | tr 'A-F' 'a-f'
          )

          test "${#FP}" -eq 64

          echo "KS_PATH=$KS" >> "$GITHUB_ENV"
          echo "KS_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "KS_FP=$FP" >> "$GITHUB_ENV"

          printf \
            '#define RA_EXPECTED_CERT_SHA256 "%s"\n' \
            "$FP" \
            > PORT/ANDROID/src/ra_sig_hash.h

      # ------------------------------------------
      # TOUCH CONTROLS
      # ------------------------------------------

      - name: Add touch controls
        if: ${{ inputs.controls == 'true' }}
        run: |
          set -e

          mkdir -p android/app/src/main/java/com/ra/port

          cat > android/app/src/main/java/com/ra/port/TouchControls.java <<'EOF'
          package com.ra.port;

          import android.app.Activity;
          import android.widget.Button;
          import android.widget.FrameLayout;

          public class TouchControls {

              public static void attach(Activity activity) {

                  FrameLayout root =
                      activity.findViewById(android.R.id.content);

                  Button left = new Button(activity);
                  left.setText("←");

                  Button right = new Button(activity);
                  right.setText("→");

                  Button up = new Button(activity);
                  up.setText("↑");

                  Button down = new Button(activity);
                  down.setText("↓");

                  Button action = new Button(activity);
                  action.setText("A");

                  FrameLayout.LayoutParams leftLp =
                      new FrameLayout.LayoutParams(160, 160);
                  leftLp.leftMargin = 30;
                  leftLp.topMargin = 300;

                  FrameLayout.LayoutParams rightLp =
                      new FrameLayout.LayoutParams(160, 160);
                  rightLp.leftMargin = 210;
                  rightLp.topMargin = 300;

                  FrameLayout.LayoutParams upLp =
                      new FrameLayout.LayoutParams(160, 160);
                  upLp.leftMargin = 120;
                  upLp.topMargin = 130;

                  FrameLayout.LayoutParams downLp =
                      new FrameLayout.LayoutParams(160, 160);
                  downLp.leftMargin = 120;
                  downLp.topMargin = 470;

                  FrameLayout.LayoutParams actionLp =
                      new FrameLayout.LayoutParams(180, 180);
                  actionLp.leftMargin = 850;
                  actionLp.topMargin = 300;

                  root.addView(left, leftLp);
                  root.addView(right, rightLp);
                  root.addView(up, upLp);
                  root.addView(down, downLp);
                  root.addView(action, actionLp);
              }
          }
          EOF

      # ------------------------------------------
      # BUILD
      # ------------------------------------------

      - name: Build APK
        run: |
          set -e

          gradle \
            -p android \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      # ------------------------------------------
      # SIGN
      # ------------------------------------------

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -f "$KS_PATH"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$KS_PATH" \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --out "$RUNNER_TEMP/berlions-signed.apk" \
            "$APK"

      # ------------------------------------------
      # VERIFY
      # ------------------------------------------

      - name: Verify APK
        run: |
          set -e

          APK="$RUNNER_TEMP/berlions-signed.apk"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --print-certs \
            "$APK"

      # ------------------------------------------
      # ARTIFACT
      # ------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: redalert-apk
          path: ${{ runner.temp }}/berlions-signed.apk
          retention-days: 7