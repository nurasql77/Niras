          s = s.replace(a, "\t\tSDL_GetWindowSize(MacWindow, &window_w, &window_h);\n\t}\n\tif (MacRenderer) {\n\t\tSDL_GetRendererOutputSize(MacRenderer, &window_w, &window_h);\n\t}\n\treturn RA_CalculateAspectViewport(MacWidth, MacHeight, window_w, window_h);", 1)

          # 2) finger path
          b = "\tSDL_GetWindowSize(MacWindow, &window_w, &window_h);\n\tif (window_w <= 0 || window_h <= 0) {"
          assert s.count(b) == 1, "finger mapping code not found"
          s = s.replace(b, "\tSDL_GetWindowSize(MacWindow, &window_w, &window_h);\n\tif (MacRenderer) {\n\t\tSDL_GetRendererOutputSize(MacRenderer, &window_w, &window_h);\n\t}\n\tif (window_w <= 0 || window_h <= 0) {", 1)

          # 3) stretched picture fills the whole surface, so a finger position
          #    (0..1 of the surface) maps straight onto the game's 640x400 screen
          import os
          if os.environ.get("STRETCH") == "true":
              head = ("static bool mobile_logical_point(float normalized_x, float normalized_y, int *logical_x, int *logical_y)\n{\n"
                      "\tif (!MacWindow || MacWidth <= 0 || MacHeight <= 0) {\n"
                      "\t\tif (logical_x) *logical_x = 0;\n"
                      "\t\tif (logical_y) *logical_y = 0;\n"
                      "\t\treturn false;\n\t}\n")
              assert s.count(head) == 1, "finger function head not found"
              direct = ("\tif (logical_x) *logical_x = RA_ClampInt((int)(normalized_x * (float)MacWidth), 0, MacWidth - 1);\n"
                        "\tif (logical_y) *logical_y = RA_ClampInt((int)(normalized_y * (float)MacHeight), 0, MacHeight - 1);\n"
                        "\treturn true;\n")
              s = s.replace(head, head + direct, 1)

          open(p, "w", encoding="utf-8").write(s)
          PYEOF
          grep -n "SDL_GetRendererOutputSize\|normalized_x \* (float)MacWidth" PORT/MAC/src/mac_sdl_runtime.cpp

