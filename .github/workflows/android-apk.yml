name: Modify My Red Alert APK

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Google Drive file ID of my APK"
        required: true
        default: "1OKGNkQqu5Ow35t8A7sDmFmykdj-YUqbT"
      app_name:
        description: "Application name"
        required: true
        default: "Berlions"

env:
  JAVA_VERSION: "17"
  BUILD_TOOLS: "35.0.0"

jobs:
  modify-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK build tools
        run: |
          sdkmanager --install "build-tools;${BUILD_TOOLS}"
          yes | sdkmanager --licenses >/dev/null || true
          echo "$ANDROID_HOME/build-tools/${BUILD_TOOLS}" >> "$GITHUB_PATH"

      - name: Install APKTool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool unzip

      - name: Download my APK
        env:
          FILE_ID: ${{ inputs.drive_file_id }}
        run: |
          python3 -m pip install --upgrade gdown
          gdown "https://drive.google.com/uc?id=${FILE_ID}" -O original.apk
          test -s original.apk
          stat -c "%s bytes" original.apk

      - name: Verify original APK
        run: |
          unzip -t original.apk

          unzip -l original.apk | grep \
            'assets/redalert/allies/INSTALL/REDALERT.INI'

          unzip -l original.apk | grep \
            'lib/arm64-v8a/libmain.so'

          unzip -l original.apk | grep \
            'lib/arm64-v8a/libSDL2.so'

          unzip -l original.apk | grep -E \
            'classes([0-9]+)?\.dex$'

      - name: Decode APK
        run: |
          apktool d \
            --force \
            --output decoded \
            original.apk

      - name: Inspect decoded APK
        run: |
          echo "=== ACTIVITIES ==="
          grep -R -E 'android:name=' \
            decoded/AndroidManifest.xml | head -100

          echo "=== SDL REFERENCES ==="
          grep -Ril \
            -E 'SDLActivity|onNativeKeyDown|onNativeKeyUp|SDL_FINGER|SDL_MOUSE' \
            decoded/smali* 2>/dev/null | head -100 || true

      - name: Change application label
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path("decoded/AndroidManifest.xml")
          s = p.read_text(errors="ignore")
          name = os.environ["APP_NAME"].replace("&", "&amp;").replace('"', "&quot;")

          s = re.sub(
              r'android:label="[^"]*"',
              f'android:label="{name}"',
              s,
              count=1
          )

          p.write_text(s)
          PY

      - name: Rebuild APK
        run: |
          apktool b decoded --output unsigned.apk
          test -s unsigned.apk

      - name: Align APK
        run: |
          zipalign -f -p 4 unsigned.apk aligned.apk
          zipalign -c -P 4 -v 4 aligned.apk

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > release.p12

          KEY_ALIAS="$(
            keytool -list -v \
              -keystore release.p12 \
              -storetype PKCS12 \
              -storepass "$KEYSTORE_PASSWORD" |
              awk -F': ' '/Alias name:/ {print $2; exit}'
          )"

          test -n "$KEY_ALIAS"

          apksigner sign \
            --ks release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --out berlions-modified.apk \
            aligned.apk

      - name: Final verification
        run: |
          test -s berlions-modified.apk

          apksigner verify \
            --verbose \
            --print-certs \
            berlions-modified.apk

          unzip -t berlions-modified.apk

          unzip -l berlions-modified.apk | grep \
            'assets/redalert/allies/INSTALL/REDALERT.INI'

          unzip -l berlions-modified.apk | grep \
            'lib/arm64-v8a/libmain.so'

          unzip -l berlions-modified.apk | grep \
            'lib/arm64-v8a/libSDL2.so'

          stat -c "%s bytes" berlions-modified.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: berlions-modified
          path: berlions-modified.apk
