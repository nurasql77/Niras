      - name: Build APK
        run: |
          set -e
          gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/36.0.0"
          OUT=android/app/build/outputs/apk/debug
          "$BT/zipalign" -f -p 4 "$OUT/app-debug.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS_PATH" --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "$OUT/berlions-signed.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT/berlions-signed.apk" | tee /tmp/certs.txt
          grep -qi "$KS_FP" /tmp/certs.txt

      - name: Verify APK
        run: |
          set -e
          APK="android/app/build/outputs/apk/debug/berlions-signed.apk"
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: redalert-apk
          path: android/app/build/outputs/apk/debug/berlions-signed.apk
          if-no-files-found: error
          retention-days: 7
