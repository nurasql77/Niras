        run: |
          set -e
          D=android/app/src/main/java/com/raport/redalert
          cat > "$D/TouchControls.java" <<'JAVAEOF'
          package com.raport.redalert;

          import android.app.Activity;
          import android.app.Dialog;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.BitmapShader;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.RectF;
          import android.graphics.Shader;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.SystemClock;
          import android.util.DisplayMetrics;
          import android.util.Log;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.InputDevice;
          import android.view.KeyCharacterMap;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.WindowManager;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import org.libsdl.app.SDLActivity;

          /** On-screen buttons that send the game's own hotkeys, plus the "about" dialog. */
          final class TouchControls {
              private static final String TAG = "TouchControls";

              private static final int I_MENU = 0;
              private static final int I_HUD = 1;
              private static final int I_INFO = 2;
              private static final int I_UP = 3;
              private static final int I_DOWN = 4;
              private static final int I_LEFT = 5;
              private static final int I_RIGHT = 6;
              private static final int I_ALL = 7;
              private static final int I_STOP = 8;
              private static final int I_GUARD = 9;
              private static final int I_CANCEL = 10;

              private final Activity activity;
              private final FrameLayout panel;

              /** The channel link and handle live inside the native library (libmain.so). */
              private static native String nativeUrl();

              private static native String nativeHandle();

              private static String channelUrl() {
                  try {
                      String value = nativeUrl();
                      return value == null ? "" : value;
                  } catch (Throwable t) {
                      return "";
                  }
              }

              private static String channelHandle() {
                  try {
                      String value = nativeHandle();
                      return value == null ? "" : value;
                  } catch (Throwable t) {
                      return "";
                  }
              }

              static void attach(final Activity activity) {
                  try {
                      final TouchControls controls = new TouchControls(activity);
                      activity.getWindow().getDecorView().post(new Runnable() {
                          @Override
                          public void run() {
                              controls.showAbout();
                          }
                      });
                  } catch (Throwable t) {
                      Log.e(TAG, "Touch controls failed to attach", t);
                  }
              }

              private TouchControls(Activity a) {
                  activity = a;
                  FrameLayout root = new FrameLayout(a);
                  panel = new FrameLayout(a);
                  root.addView(panel, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  int cell = dp(42);
                  int gap = dp(4);
                  int left = dp(10);
                  int bottom = dp(10);
                  int actionW = dp(58);

                  // Left column: Menu, HUD, About (below the mission text line)
                  panel.addView(keyButton(I_MENU, null, KeyEvent.KEYCODE_ESCAPE, false),
                      params(cell, cell, Gravity.TOP | Gravity.START, left, dp(36), 0, 0));

                  Btn hud = new Btn(a, I_HUD, null, false);
                  hud.setOnTouchListener(new View.OnTouchListener() {
                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          int action = e.getAction();
                          if (action == MotionEvent.ACTION_DOWN) {
                              ((Btn) v).setDown(true);
                          } else if (action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_CANCEL) {
                              ((Btn) v).setDown(false);
                              if (action == MotionEvent.ACTION_UP) {
                                  panel.setVisibility(panel.getVisibility() == View.VISIBLE ? View.GONE : View.VISIBLE);
                              }
                          }
                          return true;
                      }
                  });
                  root.addView(hud, params(cell, cell, Gravity.TOP | Gravity.START, left, dp(36) + cell + gap, 0, 0));

                  Btn info = new Btn(a, I_INFO, null, false);
                  info.setOnTouchListener(new View.OnTouchListener() {
                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          int action = e.getAction();
                          if (action == MotionEvent.ACTION_DOWN) {
                              ((Btn) v).setDown(true);
                          } else if (action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_CANCEL) {
                              ((Btn) v).setDown(false);
                              if (action == MotionEvent.ACTION_UP) {
                                  showAbout();
                              }
                          }
                          return true;
                      }
                  });
                  panel.addView(info, params(cell, cell, Gravity.TOP | Gravity.START, left, dp(36) + 2 * (cell + gap), 0, 0));

                  // Bottom-left: scroll pad (arrow keys)
                  panel.addView(keyButton(I_LEFT, null, KeyEvent.KEYCODE_DPAD_LEFT, false),
                      params(cell, cell, Gravity.BOTTOM | Gravity.START, left, 0, 0, bottom));
                  panel.addView(keyButton(I_DOWN, null, KeyEvent.KEYCODE_DPAD_DOWN, false),
                      params(cell, cell, Gravity.BOTTOM | Gravity.START, left + cell + gap, 0, 0, bottom));
                  panel.addView(keyButton(I_RIGHT, null, KeyEvent.KEYCODE_DPAD_RIGHT, false),
                      params(cell, cell, Gravity.BOTTOM | Gravity.START, left + 2 * (cell + gap), 0, 0, bottom));
                  panel.addView(keyButton(I_UP, null, KeyEvent.KEYCODE_DPAD_UP, false),
                      params(cell, cell, Gravity.BOTTOM | Gravity.START, left + cell + gap, 0, 0, bottom + cell + gap));

                  // Bottom: All / Stop / Guard / Cancel
                  LinearLayout row = new LinearLayout(a);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.addView(keyButton(I_ALL, "\u0412\u0441\u0435", KeyEvent.KEYCODE_E, true), rowParams(actionW, cell, gap));
                  row.addView(keyButton(I_STOP, "\u0421\u0442\u043e\u043f", KeyEvent.KEYCODE_S, true), rowParams(actionW, cell, gap));
                  row.addView(keyButton(I_GUARD, "\u041e\u0445\u0440\u0430\u043d\u0430", KeyEvent.KEYCODE_G, true), rowParams(actionW, cell, gap));

                  Btn cancel = new Btn(a, I_CANCEL, "\u041e\u0442\u043c\u0435\u043d\u0430", true);
                  cancel.setOnTouchListener(new View.OnTouchListener() {
                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          int action = e.getAction();
                          if (action == MotionEvent.ACTION_DOWN) {
                              ((Btn) v).setDown(true);
                              rightClick();
                          } else if (action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_CANCEL) {
                              ((Btn) v).setDown(false);
                          }
                          return true;
                      }
                  });
                  row.addView(cancel, rowParams(actionW, cell, gap));

                  int screenW = a.getResources().getDisplayMetrics().widthPixels;
                  panel.addView(row, params(ViewGroup.LayoutParams.WRAP_CONTENT, cell,
                      Gravity.BOTTOM | Gravity.START, (int) (screenW * 0.26f), 0, 0, bottom));

                  a.addContentView(root, new ViewGroup.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
              }

              // ---------------------------------------------------------------- buttons

              private Btn keyButton(int icon, String label, final int keyCode, boolean action) {
                  Btn b = new Btn(activity, icon, label, action);
                  b.setOnTouchListener(new View.OnTouchListener() {
                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          int a = e.getAction();
                          if (a == MotionEvent.ACTION_DOWN) {
                              ((Btn) v).setDown(true);
                              sendKey(keyCode, true);
                          } else if (a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_CANCEL) {
                              ((Btn) v).setDown(false);
                              sendKey(keyCode, false);
                          }
                          return true;
                      }
                  });
                  return b;
              }

              /** A flat, translucent button with a drawn icon (and an optional label). */
              static final class Btn extends View {
                  private final int icon;
                  private final String label;
                  private final boolean action;
                  private final float d;
                  private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final RectF rect = new RectF();
                  private final Path path = new Path();
                  private boolean down;

                  Btn(Context context, int icon, String label, boolean action) {
                      super(context);
                      this.icon = icon;
                      this.label = label;
                      this.action = action;
                      this.d = context.getResources().getDisplayMetrics().density;
                  }

                  void setDown(boolean value) {
                      down = value;
                      invalidate();
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      float w = getWidth();
                      float h = getHeight();
                      float r = 9f * d;
                      rect.set(d, d, w - d, h - d);
                      paint.setStyle(Paint.Style.FILL);
                      paint.setColor(down ? 0xCCC0392B : 0x8014181E);
                      canvas.drawRoundRect(rect, r, r, paint);
                      paint.setStyle(Paint.Style.STROKE);
                      paint.setStrokeWidth(d);
                      paint.setColor(0x33FFFFFF);
                      canvas.drawRoundRect(rect, r, r, paint);

                      if (action) {
                          paint.setStyle(Paint.Style.FILL);
                          paint.setColor(0xFFC0392B);
                          rect.set(w * 0.2f, h - 4f * d, w * 0.8f, h - 2f * d);
                          canvas.drawRoundRect(rect, d, d, paint);
                      }

                      float cx = w / 2f;
                      float cy = label != null ? h * 0.36f : h * 0.5f;
                      float s = Math.min(w, h) * (label != null ? 0.17f : 0.21f) * 1.6f;
                      paint.setColor(0xFFEEF2F5);
                      drawIcon(canvas, cx, cy, s);

                      if (label != null) {
                          paint.setStyle(Paint.Style.FILL);
                          paint.setColor(0xFFEEF2F5);
                          paint.setTextAlign(Paint.Align.CENTER);
                          paint.setTextSize(10f * d);
                          paint.setFakeBoldText(true);
                          canvas.drawText(label, cx, h - 8.5f * d, paint);
                          paint.setFakeBoldText(false);
                          paint.setTextAlign(Paint.Align.LEFT);
                      }
                  }

                  private void drawIcon(Canvas c, float cx, float cy, float s) {
                      paint.setStyle(Paint.Style.STROKE);
                      paint.setStrokeWidth(Math.max(1.5f * d, s * 0.22f));
                      paint.setStrokeCap(Paint.Cap.ROUND);
                      paint.setStrokeJoin(Paint.Join.ROUND);
                      switch (icon) {
                          case I_MENU:
                              c.drawLine(cx - s, cy - s * 0.6f, cx + s, cy - s * 0.6f, paint);
                              c.drawLine(cx - s, cy, cx + s, cy, paint);
                              c.drawLine(cx - s, cy + s * 0.6f, cx + s, cy + s * 0.6f, paint);
                              break;
                          case I_HUD:
                              rect.set(cx - s, cy - s * 0.75f, cx + s, cy + s * 0.75f);
                              c.drawRoundRect(rect, s * 0.2f, s * 0.2f, paint);
                              c.drawLine(cx + s * 0.3f, cy - s * 0.75f, cx + s * 0.3f, cy + s * 0.75f, paint);
                              break;
                          case I_INFO:
                              c.drawCircle(cx, cy, s, paint);
                              c.drawLine(cx, cy - s * 0.05f, cx, cy + s * 0.5f, paint);
                              paint.setStyle(Paint.Style.FILL);
                              c.drawCircle(cx, cy - s * 0.45f, Math.max(1.2f * d, s * 0.13f), paint);
                              break;
                          case I_UP:
                              triangle(c, cx, cy - s * 0.8f, cx + s * 0.9f, cy + s * 0.6f, cx - s * 0.9f, cy + s * 0.6f);
                              break;
                          case I_DOWN:
                              triangle(c, cx, cy + s * 0.8f, cx + s * 0.9f, cy - s * 0.6f, cx - s * 0.9f, cy - s * 0.6f);
                              break;
                          case I_LEFT:
                              triangle(c, cx - s * 0.8f, cy, cx + s * 0.6f, cy - s * 0.9f, cx + s * 0.6f, cy + s * 0.9f);
                              break;
                          case I_RIGHT:
                              triangle(c, cx + s * 0.8f, cy, cx - s * 0.6f, cy - s * 0.9f, cx - s * 0.6f, cy + s * 0.9f);
                              break;
                          case I_ALL:
                              for (int i = 0; i < 2; i++) {
                                  for (int j = 0; j < 2; j++) {
                                      float x0 = cx + (i == 0 ? -s : s * 0.1f);
                                      float y0 = cy + (j == 0 ? -s : s * 0.1f);
                                      rect.set(x0, y0, x0 + s * 0.9f, y0 + s * 0.9f);
                                      c.drawRoundRect(rect, s * 0.15f, s * 0.15f, paint);
                                  }
                              }
                              break;
                          case I_STOP:
                              paint.setStyle(Paint.Style.FILL);
                              rect.set(cx - s * 0.8f, cy - s * 0.8f, cx + s * 0.8f, cy + s * 0.8f);
                              c.drawRoundRect(rect, s * 0.2f, s * 0.2f, paint);
                              break;
                          case I_GUARD:
                              path.reset();
                              path.moveTo(cx, cy - s);
                              path.lineTo(cx + s * 0.85f, cy - s * 0.6f);
                              path.lineTo(cx + s * 0.85f, cy + s * 0.1f);
                              path.quadTo(cx + s * 0.85f, cy + s * 0.75f, cx, cy + s);
                              path.quadTo(cx - s * 0.85f, cy + s * 0.75f, cx - s * 0.85f, cy + s * 0.1f);
                              path.lineTo(cx - s * 0.85f, cy - s * 0.6f);
                              path.close();
                              c.drawPath(path, paint);
                              break;
                          case I_CANCEL:
                              c.drawLine(cx - s * 0.8f, cy - s * 0.8f, cx + s * 0.8f, cy + s * 0.8f, paint);
                              c.drawLine(cx + s * 0.8f, cy - s * 0.8f, cx - s * 0.8f, cy + s * 0.8f, paint);
                              break;
                          default:
                              break;
                      }
                  }

                  private void triangle(Canvas c, float x1, float y1, float x2, float y2, float x3, float y3) {
                      paint.setStyle(Paint.Style.FILL);
                      path.reset();
                      path.moveTo(x1, y1);
                      path.lineTo(x2, y2);
                      path.lineTo(x3, y3);
                      path.close();
                      c.drawPath(path, paint);
                  }
              }

              // ------------------------------------------------------------- about dialog

              private void showAbout() {
                  try {
                      final Dialog dialog = new Dialog(activity, android.R.style.Theme_Translucent_NoTitleBar_Fullscreen);
                      dialog.setCancelable(false);
                      Window window = dialog.getWindow();
                      if (window != null) {
                          window.addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                          window.setLayout(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT);
                          if (Build.VERSION.SDK_INT >= 28) {
                              WindowManager.LayoutParams attributes = window.getAttributes();
                              attributes.layoutInDisplayCutoutMode = Build.VERSION.SDK_INT >= 30
                                  ? WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                                  : WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                              window.setAttributes(attributes);
                          }
                      }

                      FrameLayout wrap = new FrameLayout(activity);
                      wrap.setBackgroundColor(0xC8000000);

                      LinearLayout card = new LinearLayout(activity);
                      card.setOrientation(LinearLayout.VERTICAL);
                      card.setGravity(Gravity.CENTER_HORIZONTAL);
                      GradientDrawable cardBg = new GradientDrawable();
                      cardBg.setColor(0xFF13171B);
                      cardBg.setCornerRadius(dp(16));
                      cardBg.setStroke(dp(2), 0xFF8E1B14);
                      card.setBackground(cardBg);
                      card.setPadding(dp(24), dp(16), dp(24), dp(12));

                      int logoId = activity.getResources().getIdentifier("berlions_logo", "drawable", activity.getPackageName());
                      if (logoId != 0) {
                          Bitmap src = BitmapFactory.decodeResource(activity.getResources(), logoId);
                          if (src != null) {
                              ImageView logo = new ImageView(activity);
                              int size = dp(84);
                              logo.setImageBitmap(rounded(src, size, dp(18)));
                              card.addView(logo, new LinearLayout.LayoutParams(size, size));
                          }
                      }

                      TextView kicker = new TextView(activity);
                      kicker.setText("\u041e \u041f\u041e\u0420\u0422\u0415");
                      kicker.setTextColor(0xFFE0574B);
                      kicker.setTextSize(TypedValue.COMPLEX_UNIT_SP, 10);
                      kicker.setLetterSpacing(0.14f);
                      kicker.setGravity(Gravity.CENTER);
                      LinearLayout.LayoutParams kickerLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                      kickerLp.topMargin = dp(10);
                      card.addView(kicker, kickerLp);

                      TextView title = new TextView(activity);
                      title.setText("\u041f\u043e\u0440\u0442 \u0441\u043e\u0437\u0434\u0430\u043d \u0441\u043f\u0435\u0446\u0438\u0430\u043b\u044c\u043d\u043e \u0434\u043b\u044f Berlions");
                      title.setTextColor(0xFFFFFFFF);
                      title.setTextSize(TypedValue.COMPLEX_UNIT_SP, 18);
                      title.setTypeface(null, android.graphics.Typeface.BOLD);
                      title.setGravity(Gravity.CENTER);
                      LinearLayout.LayoutParams titleLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                      titleLp.topMargin = dp(4);
                      card.addView(title, titleLp);

                      LinearLayout buttons = new LinearLayout(activity);
                      buttons.setOrientation(LinearLayout.HORIZONTAL);
                      buttons.setGravity(Gravity.CENTER);
                      TextView telegram = dialogButton("Telegram", false);
                      telegram.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View v) {
                              openLink(channelUrl());
                          }
                      });
                      TextView play = dialogButton("\u0418\u0433\u0440\u0430\u0442\u044c", true);
                      play.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View v) {
                              dialog.dismiss();
                          }
                      });
                      LinearLayout.LayoutParams bl = new LinearLayout.LayoutParams(dp(120), dp(38));
                      bl.setMargins(dp(5), 0, dp(5), 0);
                      buttons.addView(telegram, bl);
                      buttons.addView(play, bl);
                      LinearLayout.LayoutParams buttonsLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                      buttonsLp.topMargin = dp(14);
                      card.addView(buttons, buttonsLp);

                      TextView foot = new TextView(activity);
                      foot.setText("by base64E \u00b7 " + channelHandle());
                      foot.setTextColor(0xFF8B96A0);
                      foot.setTextSize(TypedValue.COMPLEX_UNIT_SP, 10);
                      foot.setGravity(Gravity.CENTER);
                      foot.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View v) {
                              openLink(channelUrl());
                          }
                      });
                      LinearLayout.LayoutParams footLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                      footLp.topMargin = dp(10);
                      card.addView(foot, footLp);

                      int screenW = activity.getResources().getDisplayMetrics().widthPixels;
                      int cardW = Math.min(dp(400), screenW - dp(32));
                      wrap.addView(card, new FrameLayout.LayoutParams(cardW, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.CENTER));
                      dialog.setContentView(wrap);
                      dialog.show();

                      Window shown = dialog.getWindow();
                      if (shown != null) {
                          shown.getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
                      }
                  } catch (Throwable t) {
                      Log.e(TAG, "About dialog failed", t);
                  }
              }

              private TextView dialogButton(String text, boolean filled) {
                  TextView b = new TextView(activity);
                  b.setText(text);
                  b.setTextColor(0xFFFFFFFF);
                  b.setTextSize(TypedValue.COMPLEX_UNIT_SP, 14);
                  b.setTypeface(null, android.graphics.Typeface.BOLD);
                  b.setGravity(Gravity.CENTER);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setCornerRadius(dp(10));
                  if (filled) {
                      bg.setColor(0xFFB3261E);
                  } else {
                      bg.setColor(0x00000000);
                      bg.setStroke(dp(2), 0xFFE0574B);
                  }
                  b.setBackground(bg);
                  return b;
              }

              private static Bitmap rounded(Bitmap src, int sizePx, float radius) {
                  Bitmap out = Bitmap.createBitmap(sizePx, sizePx, Bitmap.Config.ARGB_8888);
                  Canvas canvas = new Canvas(out);
                  Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  Bitmap scaled = Bitmap.createScaledBitmap(src, sizePx, sizePx, true);
                  p.setShader(new BitmapShader(scaled, Shader.TileMode.CLAMP, Shader.TileMode.CLAMP));
                  canvas.drawRoundRect(new RectF(0, 0, sizePx, sizePx), radius, radius, p);
                  return out;
              }

              private void openLink(String url) {
                  if (url == null || !url.startsWith("https://t.me/")) {
                      return;
                  }
                  try {
                      Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      activity.startActivity(intent);
                  } catch (Throwable t) {
                      Log.e(TAG, "Cannot open link", t);
                  }
              }

              // ------------------------------------------------------------------ input

              private void sendKey(int keyCode, boolean down) {
                  long t = SystemClock.uptimeMillis();
                  KeyEvent event = new KeyEvent(t, t,
                      down ? KeyEvent.ACTION_DOWN : KeyEvent.ACTION_UP, keyCode, 0, 0,
                      KeyCharacterMap.VIRTUAL_KEYBOARD, 0, 0, InputDevice.SOURCE_KEYBOARD);
                  activity.dispatchKeyEvent(event);
              }

              /** Right mouse click (deselect / cancel) in the middle of the map area. */
              private void rightClick() {
                  DisplayMetrics dm = activity.getResources().getDisplayMetrics();
                  float x = dm.widthPixels * 0.4f;
                  float y = dm.heightPixels * 0.5f;
                  SDLActivity.onNativeMouse(2, MotionEvent.ACTION_DOWN, x, y, false);
                  SDLActivity.onNativeMouse(0, MotionEvent.ACTION_UP, x, y, false);
              }

              private int dp(int value) {
                  return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, value,
                      activity.getResources().getDisplayMetrics());
              }

              private static FrameLayout.LayoutParams params(int w, int h, int gravity,
                                                             int l, int t, int r, int b) {
                  FrameLayout.LayoutParams p = new FrameLayout.LayoutParams(w, h, gravity);
                  p.setMargins(l, t, r, b);
                  return p;
              }

              private static LinearLayout.LayoutParams rowParams(int w, int h, int gap) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(w, h);
                  p.setMargins(gap, 0, gap, 0);
                  return p;
              }
          }
